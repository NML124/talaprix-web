<article
  class="card overflow-hidden rounded-card border border-base-300 bg-base-100 shadow-sm transition-shadow duration-200 hover:shadow-md motion-reduce:transition-none"
>
  @if (product().imageUrl; as imageUrl) {
    <figure class="aspect-4/3 bg-white p-4">
      <img
        class="h-full w-full object-contain"
        [src]="imageUrl"
        [alt]="product().name"
        loading="lazy"
      />
    </figure>
  }
  <div class="card-body gap-2 p-4">
    <h2 class="card-title text-base">{{ product().name }}</h2>
    @if (product().lowestPrice; as price) {
      <p class="text-lg font-bold text-brand-600 dark:text-brand-500">
        {{ formatPrice(price.amount, price.currency) }}
      </p>
    }
    <p class="text-sm text-base-content/65">
      {{ product().offerCount }} offre(s) comparée(s)
    </p>
  </div>
</article>
