<article
  class="group flex h-full w-full max-w-[278px] cursor-pointer flex-col overflow-hidden rounded-[16px] border border-[#e7e9e8] bg-white p-[3px] text-left [font-family:'Lato',sans-serif] transition-[border-color,box-shadow,transform] duration-300 hover:-translate-y-[2px] hover:border-[#d9dddc] hover:shadow-[0_10px_28px_rgba(15,30,27,0.06)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009788] sm:rounded-[22px] sm:p-[4px] motion-reduce:transform-none motion-reduce:transition-none"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Voir les offres de ' + product().name"
  (click)="open()"
  (keydown.enter)="open()"
  (keydown.space)="open()"
>
  <!-- =========================================================
       IMAGE
  ========================================================== -->
  <figure
    class="relative flex h-[118px] w-full shrink-0 items-center justify-center overflow-hidden rounded-[13px] bg-[#D9D9D9] sm:h-[188px] sm:rounded-[18px]"
  >
    @if (product().imageUrl; as imageUrl) {
    <img
      [src]="imageUrl"
      [alt]="product().name"
      loading="lazy"
      class="h-full w-full object-contain p-[16px] transition-transform duration-500 group-hover:scale-[1.035] sm:p-[18px] motion-reduce:transition-none"
    />
    } @else {
    <img
      src="/assets/images/logo_app.png"
      alt=""
      aria-hidden="true"
      class="h-16 w-16 object-contain opacity-35"
    />
    }

    <!-- =======================================================
         FAVORITE
    ======================================================== -->
    <button
      type="button"
      class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white/95 shadow-[0_2px_10px_rgba(0,0,0,0.05)] backdrop-blur-sm transition duration-200 hover:scale-105 hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009788]/25 sm:right-2.5 sm:top-2.5 sm:h-[34px] sm:w-[34px]"
      [style.color]="favorite() ? '#009788' : '#27302e'"
      [attr.aria-label]="
        favorite()
          ? 'Retirer des favoris'
          : 'Ajouter aux favoris'
      "
      (click)="toggleFavorite($event)"
    >
      <svg
        lucideHeart
        size="15"
        strokeWidth="1.9"
        [attr.fill]="favorite() ? '#009788' : 'none'"
        [attr.stroke]="favorite() ? '#009788' : '#27302e'"
        aria-hidden="true"
      ></svg>
    </button>
  </figure>

  <!-- =========================================================
       CONTENT
  ========================================================== -->
  <div
    class="flex flex-1 flex-col px-2.5 pb-2.5 pt-2.5 sm:px-3.5 sm:pb-3.5 sm:pt-3"
  >
    <!-- PRODUCT NAME -->
    <h2
      class="line-clamp-2 min-h-[30px] text-[13px] font-bold leading-[15px] tracking-[-0.015em] text-[#17201e] sm:min-h-[36px] sm:text-[16px] sm:leading-[19px]"
    >
      {{ product().name }}
    </h2>

    <!-- =======================================================
         MERCHANT
    ======================================================== -->
    <div class="mt-2 flex items-center gap-1.5 sm:mt-2.5 sm:gap-2.5">
      <!-- Merchant icon -->
      <span
        class="hidden h-[32px] w-[32px] shrink-0 place-items-center rounded-full bg-[#f1f3f2] text-[#26312e] sm:grid"
      >
        <svg lucideStore size="14" strokeWidth="1.9" aria-hidden="true"></svg>
      </span>

      <!-- Merchant name -->
      <div class="min-w-0 flex-1">
        <p
          class="truncate text-[11px] font-bold leading-none text-[#28322f] sm:text-[13px]"
        >
          {{ product().merchantName ?? 'Marchand partenaire' }}
        </p>

        <p class="mt-1 hidden text-[9px] leading-none text-[#929a98] sm:block">
          Fournisseur
        </p>
      </div>

      <!-- Chevron -->
      <span
        class="grid h-5 w-5 shrink-0 place-items-center rounded-full text-[#919997] transition-colors duration-200 group-hover:bg-[#f3f5f4] group-hover:text-[#4f5a57] sm:h-7 sm:w-7"
      >
        <svg
          lucideChevronRight
          size="13"
          aria-hidden="true"
          class="transition-transform duration-200 group-hover:translate-x-[1px]"
        ></svg>
      </span>
    </div>

    <!-- =======================================================
         DIVIDER
    ======================================================== -->
    <div class="my-2 h-px w-full bg-[#eceeed] sm:my-3"></div>

    <!-- =======================================================
         PRICE + CART
    ======================================================== -->
    <div
      class="mt-auto flex min-h-[30px] items-end justify-between gap-2 sm:min-h-[36px] sm:gap-3"
    >
      <!-- PRICE -->
      @if (product().lowestPrice; as price) {
      <div class="min-w-0">
        <p class="text-[9px] leading-none text-[#858d8b] sm:text-[10px]">
          à partir de
        </p>

        <p
          class="mt-1 whitespace-nowrap text-[14px] font-black leading-none tracking-[-0.025em] text-[#009788] sm:mt-1.5 sm:text-[17px]"
        >
          {{ formatPrice(price.amount, price.currency) }}
        </p>
      </div>
      }

      <!-- =====================================================
           CART EMPTY
      ====================================================== -->
      @if (cartQuantity() === 0) {
      <button
        type="button"
        class="relative flex h-[30px] w-[30px] shrink-0 items-center justify-center rounded-full border border-[#e1e5e3] bg-[#f4f5f5] transition duration-200 hover:border-[#d4d9d7] hover:bg-[#ecefee] active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009788]/20 sm:h-[34px] sm:w-[34px]"
        [attr.aria-label]="'Ajouter ' + product().name + ' au panier'"
        (click)="addToCart($event)"
      >
        <svg
          lucideShoppingBasket
          size="17"
          strokeWidth="1.9"
          class="text-[#009788]"
          aria-hidden="true"
        ></svg>
      </button>
      }

      <!-- =====================================================
           CART QUANTITY
      ====================================================== -->
      @else {
      <div
        class="flex h-[32px] shrink-0 items-center overflow-hidden rounded-full border border-[#dfe3e1] bg-[#f1f3f2] text-[#26302d]"
      >
        <!-- MINUS -->
        <button
          type="button"
          class="grid h-full w-[28px] place-items-center text-[#404946] transition hover:bg-[#e5e8e7] active:bg-[#dde1df] focus-visible:outline-none"
          [attr.aria-label]="'Diminuer la quantité de ' + product().name"
          (click)="decreaseQuantity($event)"
        >
          <svg lucideMinus size="12" strokeWidth="2.2" aria-hidden="true"></svg>
        </button>

        <!-- QUANTITY -->
        <span
          class="grid min-w-[22px] place-items-center text-[11px] font-bold text-[#202725]"
        >
          {{ cartQuantity() }}
        </span>

        <!-- PLUS -->
        <button
          type="button"
          class="grid h-full w-[28px] place-items-center text-[#404946] transition hover:bg-[#e5e8e7] active:bg-[#dde1df] focus-visible:outline-none"
          [attr.aria-label]="'Augmenter la quantité de ' + product().name"
          (click)="increaseQuantity($event)"
        >
          <svg lucidePlus size="12" strokeWidth="2.2" aria-hidden="true"></svg>
        </button>
      </div>
      }
    </div>
  </div>
</article>
