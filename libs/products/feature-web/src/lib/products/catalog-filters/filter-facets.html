<section
  class="mx-3 mt-3 rounded-2xl border border-[#e1e8e5] bg-[#fbfcfc] px-4 py-4"
>
  <h3 class="text-[15px] font-bold text-[#111817]">Boutiques</h3>
  <div class="mt-3 space-y-2.5">
    @for (shop of shops(); track shop) {<label
      class="flex cursor-pointer items-center gap-2.5 rounded-lg px-1 py-1 text-[14px] font-medium text-[#111817] hover:bg-[#edf7f5]"
      ><input
        type="checkbox"
        class="h-[18px] w-[18px] accent-[#009788]"
        [checked]="selectedShops().includes(shop)"
        (change)="toggleShop(shop)"
      />{{ shop }}</label
    >}
  </div>
</section>
<section
  class="mx-3 mt-3 rounded-2xl border border-[#e1e8e5] bg-[#fbfcfc] px-4 py-4"
>
  <h3 class="text-[15px] font-bold text-[#111817]">Localisation</h3>
  <div class="mt-3 space-y-2.5">
    @for (location of locations(); track location) {<label
      class="flex cursor-pointer items-center gap-2.5 rounded-lg px-1 py-1 text-[14px] font-medium text-[#111817] hover:bg-[#edf7f5]"
      ><input
        type="checkbox"
        class="h-[18px] w-[18px] accent-[#009788]"
        [checked]="selectedLocations().includes(location)"
        (change)="toggleLocation(location)"
      />{{ location }}</label
    >}
  </div>
</section>
<section
  class="mx-3 mt-3 space-y-1 rounded-2xl border border-[#e1e8e5] bg-[#fbfcfc] px-4 py-3"
>
  <label
    class="flex cursor-pointer items-center justify-between rounded-lg px-1 py-2 text-[14px] font-semibold text-[#111817] hover:bg-[#edf7f5]"
    ><span>Promotions uniquement</span
    ><input
      type="checkbox"
      class="h-[18px] w-[18px] accent-[#009788]"
      [checked]="promotionOnly()"
      (change)="togglePromotion()" /></label
  ><label
    class="flex cursor-pointer items-center justify-between rounded-lg px-1 py-2 text-[14px] font-semibold text-[#111817] hover:bg-[#edf7f5]"
    ><span>Disponibles en stock</span
    ><input
      type="checkbox"
      class="h-[18px] w-[18px] accent-[#009788]"
      [checked]="availableOnly()"
      (change)="toggleAvailability()"
  /></label>
</section>
