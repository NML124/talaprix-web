<aside
  class="hidden self-start overflow-hidden rounded-[16px] border border-[#e3e9e7] bg-white lg:sticky lg:top-24 lg:block lg:max-h-[calc(100dvh-7rem)] lg:overflow-y-auto"
>
  <tpx-filter-controls
    [categories]="categories()"
    [selection]="selection()"
    (selectionChange)="update($event)"
    (applyRequested)="apply()"
    (resetRequested)="reset()"
  />
</aside>
<button
  #trigger
  type="button"
  (click)="openMobile()"
  class="flex h-10 w-full items-center justify-center gap-2 rounded-lg border border-[#dbe5e2] bg-white text-sm font-bold text-[#24312d] lg:hidden"
>
  <svg
    lucideSlidersHorizontal
    size="17"
    class="text-[#009788]"
    aria-hidden="true"
  ></svg>
  Filtrer et trier
</button>
@if (mobileOpen()) {
<div class="fixed inset-0 z-[80] lg:hidden">
  <button
    type="button"
    class="absolute inset-0 bg-[#172522]/35"
    aria-label="Fermer les filtres"
    (click)="closeMobile()"
  ></button>
  <section
    role="dialog"
    aria-modal="true"
    aria-label="Filtres produits"
    class="absolute inset-x-0 bottom-0 max-h-[88dvh] overflow-y-auto rounded-t-[22px] bg-white shadow-2xl"
  >
    <header
      class="sticky top-0 z-10 flex items-center justify-between border-b border-[#edf0ef] bg-white px-4 py-3"
    >
      <h2 class="text-base font-bold text-[#172522]">Filtres</h2>
      <button
        type="button"
        (click)="closeMobile()"
        aria-label="Fermer les filtres"
        class="grid h-10 w-10 place-items-center rounded-full text-[#26332f]"
      >
        <svg lucideX size="20" aria-hidden="true"></svg>
      </button>
    </header>
    <tpx-filter-controls
      [categories]="categories()"
      [selection]="selection()"
      (selectionChange)="update($event)"
      (applyRequested)="apply()"
      (resetRequested)="reset()"
    />
  </section>
</div>
}
