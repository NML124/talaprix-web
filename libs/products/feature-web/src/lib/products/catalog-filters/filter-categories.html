<section
  class="mx-3 mt-3 rounded-2xl border border-[#e1e8e5] bg-[#fbfcfc] px-4 py-4"
>
  <h3 class="text-[15px] font-bold text-[#111817]">Catégories</h3>
  <input
    type="search"
    placeholder="Rechercher une catégorie..."
    [value]="search()"
    (input)="updateSearch($event)"
    aria-label="Rechercher une catégorie"
    class="mt-3 h-11 w-full rounded-xl border border-[#cfdad6] bg-white px-3 text-[14px] text-[#111817] outline-none focus:border-[#009788] focus:ring-2 focus:ring-[#009788]/15"
  />
  <div class="mt-3 max-h-52 space-y-2.5 overflow-y-auto pr-1">
    @for (category of visibleCategories(); track category) {
    <label
      class="flex cursor-pointer items-center gap-2.5 rounded-lg px-1 py-1 text-[14px] font-medium text-[#111817] hover:bg-[#edf7f5]"
    >
      <input
        type="checkbox"
        class="h-[18px] w-[18px] accent-[#009788]"
        [checked]="selected().includes(category)"
        (change)="toggle(category)"
      />
      <span class="truncate">{{ category }}</span>
    </label>
    }
  </div>
</section>
