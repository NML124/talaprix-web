<section
  class="mx-3 mt-3 rounded-2xl border border-[#e1e8e5] bg-[#fbfcfc] px-4 py-4"
>
  <div class="flex items-center justify-between">
    <h3 class="text-[15px] font-bold text-[#111817]">Prix (CDF)</h3>
    <span class="text-[12px] font-medium text-[#4b5754]"
      >{{ min() | number:'1.0-0':'fr' }} — {{ max() | number:'1.0-0':'fr'
      }}</span
    >
  </div>
  <div
    #sliderTrack
    class="relative mt-5 h-8 touch-none"
    role="group"
    aria-label="Fourchette de prix"
    (pointerdown)="beginDrag($event)"
  >
    <span
      class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 rounded bg-[#dce5e3]"
    ></span
    ><span
      class="absolute top-1/2 h-1 -translate-y-1/2 rounded bg-[#009788]"
      [style.left.%]="left()"
      [style.width.%]="width()"
    ></span
    ><input
      type="range"
      aria-label="Prix minimum"
      [min]="floor()"
      [max]="ceiling()"
      step="10000"
      [value]="min()"
      (input)="updateMin($event)"
      class="pointer-events-none absolute inset-0 z-20 h-8 w-full opacity-0"
      (focus)="setActiveHandle('min')"
      (blur)="endDrag()"
    /><input
      type="range"
      aria-label="Prix maximum"
      [min]="floor()"
      [max]="ceiling()"
      step="10000"
      [value]="max()"
      (input)="updateMax($event)"
      class="pointer-events-none absolute inset-0 z-20 h-8 w-full opacity-0"
      (focus)="setActiveHandle('max')"
      (blur)="endDrag()"
    /><span
      class="pointer-events-none absolute top-1/2 z-10 h-[18px] w-[18px] -translate-y-1/2 -translate-x-1/2 rounded-full border-2 border-white bg-[#009788] shadow-sm ring-2 ring-[#009788]/15"
      [class.ring-4]="activeHandle() === 'min'"
      [style.left.%]="left()"
    ></span
    ><span
      class="pointer-events-none absolute top-1/2 z-10 h-[18px] w-[18px] -translate-y-1/2 -translate-x-1/2 rounded-full border-2 border-white bg-[#009788] shadow-sm ring-2 ring-[#009788]/15"
      [class.ring-4]="activeHandle() === 'max'"
      [style.left.%]="left() + width()"
    ></span>
  </div>
  <div class="mt-3 grid grid-cols-2 gap-2">
    <input
      type="number"
      placeholder="Min"
      [value]="minPrice() ?? ''"
      [min]="floor()"
      [max]="max() - 10000"
      step="10000"
      aria-label="Prix minimum en CDF"
      (input)="updateField($event, true)"
      class="h-11 rounded-xl border border-[#cfdad6] bg-white px-3 text-[14px] font-medium text-[#111817] outline-none focus:border-[#009788] focus:ring-2 focus:ring-[#009788]/15"
    /><input
      type="number"
      placeholder="Max"
      [value]="maxPrice() ?? ''"
      [min]="min() + 10000"
      [max]="ceiling()"
      step="10000"
      aria-label="Prix maximum en CDF"
      (input)="updateField($event, false)"
      class="h-11 rounded-xl border border-[#cfdad6] bg-white px-3 text-[14px] font-medium text-[#111817] outline-none focus:border-[#009788] focus:ring-2 focus:ring-[#009788]/15"
    />
  </div>
</section>
