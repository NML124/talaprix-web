@if (status() === 'loading' || status() === 'idle') {
<div
  class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
>
  @for (item of [1, 2, 3, 4]; track item) {
  <div class="h-80 animate-pulse rounded-[18px] bg-white"></div>
  }
</div>
} @else if (products().length) {
<section
  [class]="viewMode() === 'grid' ? 'mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 lg:gap-4 xl:grid-cols-5' : 'mt-4 grid grid-cols-1 gap-3'"
>
  @for (product of products(); track product.id) {<tpx-product-card
    [product]="product"
    [favorite]="favoriteIds().includes(product.id)"
    (viewDetails)="productOpen.emit($event)"
    (favoriteChange)="favoriteChange.emit($event)"
  />}
</section>
} @else {
<section
  class="mt-4 rounded-[18px] border border-dashed border-[#cfded9] bg-white px-5 py-16 text-center"
>
  <h2 class="text-lg font-black">Aucun produit trouvé</h2>
  <p class="mt-2 text-sm text-[#687572]">
    Modifiez votre recherche ou vos filtres.
  </p>
</section>
}
