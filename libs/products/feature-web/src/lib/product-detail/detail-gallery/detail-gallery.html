<div class="grid gap-3 sm:grid-cols-[72px_minmax(0,1fr)]">
  <div class="order-2 flex gap-2 overflow-x-auto sm:order-1 sm:flex-col">
    @for (image of images(); track $index; let i = $index) {<button
      type="button"
      (click)="select(i)"
      class="grid h-16 w-16 shrink-0 place-items-center rounded-[10px] border bg-white"
      [class.border-[#009788]]="index() === i"
      [class.border-[#dfe7e5]]="index() !== i"
    >
      <img
        [src]="image ?? '/assets/images/logo_app.png'"
        [alt]="product().name"
        class="h-10 w-10 object-contain"
      /></button
    >}
  </div>
  <figure
    class="order-1 flex min-h-[300px] items-center justify-center overflow-hidden rounded-[14px] border border-[#e3e9e7] bg-[#f8faf9] sm:order-2"
  >
    <img
      [src]="images()[index()] ?? '/assets/images/logo_app.png'"
      [alt]="product().name"
      class="h-48 w-48 object-contain sm:h-60 sm:w-60"
    />
  </figure>
</div>
