<main class="min-h-screen bg-[#f8faf9] pb-14 pt-4 text-[#172522]">
  <section class="mx-auto max-w-[1536px] px-3 sm:px-5 lg:px-6">
    <a
      routerLink="/products"
      class="mb-4 inline-flex items-center gap-1.5 text-xs text-[#687572] transition hover:text-[#009788]"
      ><svg lucideArrowLeft size="15"></svg>Retour aux produits</a
    >
    @if (product(); as currentProduct) {
    <section
      class="grid gap-4 xl:grid-cols-[minmax(0,1.9fr)_minmax(300px,.62fr)]"
    >
      <article
        class="rounded-[18px] border border-[#e1e8e6] bg-white p-3 sm:p-5"
      >
        <div
          class="grid gap-5 lg:grid-cols-[minmax(300px,.9fr)_minmax(0,1.1fr)]"
        >
          <tpx-detail-gallery [product]="currentProduct" />
          <tpx-detail-information [product]="currentProduct" />
        </div>
      </article>
      <tpx-detail-offer [product]="currentProduct" />
    </section>
    <tpx-detail-offers class="mt-4 block" [product]="currentProduct" />
    } @else {
    <section
      class="mt-8 rounded-[18px] border border-[#e2e9e7] bg-white px-6 py-16 text-center"
    >
      <img
        src="/assets/images/logo_app.png"
        alt=""
        class="mx-auto h-12 w-12 opacity-60"
      />
      <h1 class="mt-5 text-2xl font-black">Produit introuvable</h1>
      <p class="mt-2 text-sm text-[#6f7b78]">
        Ce produit n'est plus disponible ou l'adresse utilisée n'est pas valide.
      </p>
      <a
        routerLink="/products"
        class="mt-5 inline-flex rounded-xl bg-[#009788] px-5 py-3 text-sm font-bold text-white"
        >Voir le catalogue</a
      >
    </section>
    }
  </section>
</main>
