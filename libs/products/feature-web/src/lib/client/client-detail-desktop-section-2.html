<section
  class="[background:var(--client-surface)] [border-radius:12px] [padding:28px] [display:grid] [grid-template-columns:repeat(auto-fit,_minmax(min(100%,_440px),_1fr))] [gap:40px]"
>
  <div
    class="[display:grid] [grid-template-columns:76px_minmax(0,_1fr)] [gap:14px]"
  >
    <div class="[display:flex] [flex-direction:column] [gap:10px]">
      <button
        type="button"
        aria-label="Vue d’ensemble"
        aria-pressed="true"
        class="[width:76px] [height:76px] [border-radius:10px] [background:var(--client-tile)] [border:2px_solid_var(--client-action)] [padding:0] [cursor:pointer] [display:flex] [align-items:center] [justify-content:center] client-thumb"
      >
        <svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:60px] [height:60px]"
          tpxVisual
          symbol="i-phone"
        ></svg>
      </button>
      <button
        type="button"
        aria-label="Face avant"
        aria-pressed="false"
        class="[width:76px] [height:76px] [border-radius:10px] [background:var(--client-tile)] [border:2px_solid_transparent] [padding:0] [cursor:pointer] [display:flex] [align-items:center] [justify-content:center] client-thumb"
      >
        <svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:60px] [height:60px]"
          tpxVisual
          symbol="i-phone-front"
        ></svg>
      </button>
      <button
        type="button"
        aria-label="Dos"
        aria-pressed="false"
        class="[width:76px] [height:76px] [border-radius:10px] [background:var(--client-tile)] [border:2px_solid_transparent] [padding:0] [cursor:pointer] [display:flex] [align-items:center] [justify-content:center] client-thumb"
      >
        <svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:60px] [height:60px]"
          tpxVisual
          symbol="i-phone-back"
        ></svg>
      </button>
      <button
        type="button"
        aria-label="Profil"
        aria-pressed="false"
        class="[width:76px] [height:76px] [border-radius:10px] [background:var(--client-tile)] [border:2px_solid_transparent] [padding:0] [cursor:pointer] [display:flex] [align-items:center] [justify-content:center] client-thumb"
      >
        <svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:60px] [height:60px]"
          tpxVisual
          symbol="i-phone-side"
        ></svg>
      </button>
    </div>
    <div
      class="[height:420px] [border-radius:14px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] [position:relative]"
    >
      <svg
        viewBox="0 0 200 200"
        aria-hidden="true"
        class="[width:360px] [height:360px]"
        tpxVisual
        symbol="i-phone"
      ></svg>
      <span
        class="[position:absolute] [left:14px] [bottom:12px] [font-size:11.5px] [color:var(--client-muted)]"
        >Image indicative</span
      >
    </div>
  </div>
  <div class="[display:flex] [flex-direction:column] [gap:16px]">
    <div class="[display:flex] [flex-direction:column] [gap:6px]">
      <a
        routerLink="/resultats"
        class="[font-size:13.5px] [font-weight:500] [text-decoration:none]"
        >Samsung</a
      >
      <h1
        class="[margin:0] [font-size:30px] [line-height:1.12] [font-weight:500] [letter-spacing:-0.03em]"
      >
        Samsung Galaxy S24 128 Go
      </h1>
      <span class="[font-size:14px] [color:var(--client-text-tertiary)]"
        >Téléphones ·
        <strong class="[color:var(--client-text)]">6 offres</strong> de
        <span
          class="[font-variant-numeric:tabular-nums]"
          tpxPriceTag
          [value]="ui.money(610)"
        ></span>
        à
        <span
          class="[font-variant-numeric:tabular-nums]"
          tpxPriceTag
          [value]="ui.money(719)"
        ></span
      ></span>
    </div>
    <div
      class="[border-radius:14px] [background:var(--client-mint-soft)] [padding:20px] [display:flex] [flex-direction:column] [gap:14px]"
    >
      <span
        class="[display:flex] [align-items:center] [gap:8px] [font-size:13px] [font-weight:500] [color:var(--client-action-hover)]"
        ><svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-dfbbf6ea15a0"
        ></svg
        >Meilleur prix en neuf</span
      >
      <div
        class="[display:flex] [align-items:flex-end] [justify-content:space-between] [gap:16px] [flex-wrap:wrap]"
      >
        <div class="[display:flex] [flex-direction:column] [gap:2px]">
          <span
            class="[font-size:38px] [line-height:1] [font-weight:600] [letter-spacing:-0.035em] [font-variant-numeric:tabular-nums]"
            tpxPriceTag
            [value]="ui.money(689)"
          ></span>
          <span
            class="[font-size:13px] [color:var(--client-text-tertiary)] [font-variant-numeric:tabular-nums]"
            >{{ ui.approximate(689) }}</span
          >
        </div>
        <div
          class="[display:flex] [flex-direction:column] [align-items:flex-end] [gap:2px] [font-size:14px]"
        >
          <span class="[font-weight:500]">UAC – Gombe</span>
          <span class="[color:var(--client-text-tertiary)]"
            >Boulevard du 30 Juin ·
            <span class="[color:var(--client-distance)] [font-weight:500]"
              >1,2 km</span
            ></span
          >
        </div>
      </div>
      <div class="[display:flex] [gap:10px] [flex-wrap:wrap]">
        <a
          href="#"
          class="[flex:1_1_200px] [display:flex] [align-items:center] [justify-content:center] [gap:8px] [height:54px] [border-radius:20px] [background:var(--client-action)] [color:var(--client-surface)] [font-size:15px] [font-weight:500] [text-decoration:none] client-btn-p"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            tpxVisual
            symbol="icon-665647541809"
          ></svg
          >Contacter sur WhatsApp</a
        >
        <a
          class="[flex:1_1_160px] [display:flex] [align-items:center] [justify-content:center] [gap:8px] [height:54px] [border-radius:20px] [background:var(--client-surface)] [border:1px_solid_var(--client-border)] [color:var(--client-text)] [font-size:15px] [font-weight:500] [text-decoration:none] client-btn-o"
          routerLink="/boutiques"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            tpxVisual
            symbol="icon-b09d6f77f99e"
          ></svg
          >Itinéraire</a
        >
      </div>
      <span
        class="[font-size:12.5px] [color:var(--client-text-tertiary)] [display:flex] [align-items:center] [gap:6px]"
        ><svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#007A6C"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-2726f937d0bc"
        ></svg
        >Prix confirmé par la boutique · Disponible</span
      >
    </div>
    <div class="[display:flex] [gap:8px] [flex-wrap:wrap]">
      <button
        type="button"
        aria-pressed="false"
        class="[display:inline-flex] [align-items:center] [gap:8px] [height:40px] [padding:0_16px] [border-radius:14px] [border:1px_solid_var(--client-border)] [background:var(--client-surface)] [font:inherit] [font-size:14px] [font-weight:500] [color:var(--client-text)] [cursor:pointer] client-btn-o"
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-d6d8d482ea7e"
        ></svg
        >Suivre le prix
      </button>
      <button
        type="button"
        class="[display:inline-flex] [align-items:center] [gap:8px] [height:40px] [padding:0_16px] [border-radius:14px] [border:1px_solid_var(--client-border)] [background:var(--client-surface)] [font:inherit] [font-size:14px] [font-weight:500] [color:var(--client-text)] [cursor:pointer] client-btn-o"
        (click)="catalog.add('Samsung Galaxy S24 128 Go', 689, 'UAC – Gombe')"
        [attr.aria-pressed]="catalog.added('Samsung Galaxy S24 128 Go')"
      >
        {{ catalog.added('Samsung Galaxy S24 128 Go') ? '✓ Ajouté' : '+ Panier'
        }}
      </button>
      <button
        type="button"
        class="[display:inline-flex] [align-items:center] [gap:8px] [height:40px] [padding:0_16px] [border-radius:14px] [border:1px_solid_var(--client-border)] [background:var(--client-surface)] [font:inherit] [font-size:14px] [font-weight:500] [color:var(--client-text)] [cursor:pointer] client-btn-o"
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-18aca390c673"
        ></svg
        >Partager
      </button>
    </div>
  </div>
</section>
