<section
  class="[background:var(--client-surface)] [border-radius:16px] [padding:16px_12px_12px]"
>
  <div
    class="[display:flex] [align-items:baseline] [justify-content:space-between] [padding:0_4px_10px]"
  >
    <h2 class="[margin:0] [font-size:17px] [font-weight:600]">Énergie</h2>
    <a
      routerLink="/resultats"
      class="[font-size:13px] [font-weight:600] [text-decoration:none]"
      >Tout voir<span class="inline-flex align-middle"
        ><svg
          tpxVisual
          symbol="client-chevron-right"
          class="client-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        ></svg></span
    ></a>
  </div>
  <div
    class="[display:grid] [grid-template-columns:repeat(3,_minmax(0,_1fr))] [gap:12px_8px]"
  >
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [align-items:center] [gap:8px] [text-decoration:none] [color:var(--client-text)]"
    >
      <span
        class="[width:100%] [aspect-ratio:1] [border-radius:14px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:76%] [height:76%]"
          tpxVisual
          symbol="i-solar"
        ></svg
      ></span>
      <span
        class="[font-size:12.5px] [font-weight:500] [text-align:center] [line-height:1.3]"
        >Panneaux solaires</span
      >
    </a>
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [align-items:center] [gap:8px] [text-decoration:none] [color:var(--client-text)]"
    >
      <span
        class="[width:100%] [aspect-ratio:1] [border-radius:14px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:76%] [height:76%]"
          tpxVisual
          symbol="i-power"
        ></svg
      ></span>
      <span
        class="[font-size:12.5px] [font-weight:500] [text-align:center] [line-height:1.3]"
        >Stations d’énergie</span
      >
    </a>
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [align-items:center] [gap:8px] [text-decoration:none] [color:var(--client-text)]"
    >
      <span
        class="[width:100%] [aspect-ratio:1] [border-radius:14px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:76%] [height:76%]"
          tpxVisual
          symbol="i-powerbank"
        ></svg
      ></span>
      <span
        class="[font-size:12.5px] [font-weight:500] [text-align:center] [line-height:1.3]"
        >Batteries externes</span
      >
    </a>
  </div>
</section>
