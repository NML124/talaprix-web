@if (store.similar().length) {
<section aria-labelledby="similar-title" class="mt-10">
  <h2 id="similar-title" class="m-0 mb-4 text-xl font-semibold tracking-tight">
    Produits similaires
  </h2>
  <ul
    class="-mx-4 m-0 flex list-none snap-x snap-mandatory gap-3 overflow-x-auto px-4 pb-2 sm:mx-0 sm:px-0"
  >
    @for (item of store.similar(); track item.id) {
    <li class="w-[160px] shrink-0 snap-start sm:w-[190px]">
      <a
        [routerLink]="['/produit', item.id]"
        class="group flex h-full flex-col gap-2 rounded-3xl bg-[var(--client-surface)] p-2.5 text-[var(--client-text)] no-underline"
      >
        <span
          class="flex aspect-square items-center justify-center overflow-hidden rounded-[18px] bg-[var(--client-tile)]"
        >
          @if (item.image) {
          <img
            [src]="item.image"
            alt=""
            loading="lazy"
            class="h-full w-full object-contain p-3 mix-blend-multiply transition-transform duration-500 group-hover:scale-105 motion-reduce:transition-none"
          />
          }
        </span>
        <span class="line-clamp-2 px-1 text-[13px] font-medium leading-snug"
          >{{ item.name }}</span
        >
        <span class="mt-auto px-1 pb-1 text-[15px] font-semibold tabular-nums"
          ><span class="text-[11px] font-normal text-[var(--client-muted)]"
            >dès </span
          >{{ store.price(item) }}</span
        >
      </a>
    </li>
    }
  </ul>
</section>
}
