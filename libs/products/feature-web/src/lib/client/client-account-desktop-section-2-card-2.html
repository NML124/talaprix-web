<article
  [hidden]="!catalog.favorite('HP ProBook 440 G9 i5, 16 Go, 512 Go')"
  class="[position:relative] [display:flex] [flex-direction:column] [gap:8px] [padding:6px_6px_14px]"
>
  <a
    class="[position:relative] [height:180px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] client-pimg"
    aria-label="HP ProBook 440 G9 i5, 16 Go, 512 Go"
    routerLink="/produit/samsung-galaxy-s24-128-go"
    ><svg
      viewBox="0 0 200 200"
      aria-hidden="true"
      class="[width:150px] [height:150px]"
      tpxVisual
      symbol="i-laptop"
    ></svg>
  </a>
  <button
    type="button"
    aria-label="Retirer des favoris"
    (click)="catalog.toggleFavorite('HP ProBook 440 G9 i5, 16 Go, 512 Go')"
    [attr.aria-pressed]="catalog.favorite('HP ProBook 440 G9 i5, 16 Go, 512 Go')"
    [style.color]="catalog.favorite('HP ProBook 440 G9 i5, 16 Go, 512 Go') ? '#007A6C' : '#2E3B37'"
    class="[position:absolute] [top:14px] [right:14px] [width:32px] [height:32px] [border-radius:16px] [border:0] [background:var(--client-surface)] [box-shadow:0_1px_3px_rgba(15,26,23,0.12)] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-action)] [cursor:pointer]"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      [attr.fill]="catalog.favorite('HP ProBook 440 G9 i5, 16 Go, 512 Go') ? '#E3F2EF' : 'none'"
      tpxVisual
      symbol="icon-d6d8d482ea7e"
    ></svg>
  </button>
  <a
    class="[font-size:14px] [line-height:1.35] [color:var(--client-text)] [text-decoration:none] [height:38px] [overflow:hidden] client-ptitle client-product-title"
    routerLink="/produit/samsung-galaxy-s24-128-go"
    title="HP ProBook 440 G9 i5, 16 Go, 512 Go"
    >HP ProBook 440 G9 i5, 16 Go, 512 Go</a
  >
  <span class="[display:flex] [align-items:baseline] [gap:8px]"
    ><span
      class="[font-size:19px] [font-weight:600] [letter-spacing:-0.02em] [font-variant-numeric:tabular-nums]"
      tpxPriceTag
      [value]="ui.money(745)"
    ></span
  ></span>
  <span class="[font-size:12.5px] [color:var(--client-text-tertiary)]"
    >3 boutiques</span
  >
  <button
    type="button"
    role="switch"
    aria-checked="false"
    (click)="catalog.toggleAlert('Alerte client-account-desktop-section-2')"
    [attr.aria-checked]="catalog.alert('Alerte client-account-desktop-section-2')"
    class="[display:flex] [align-items:center] [justify-content:space-between] [gap:8px] [margin-top:4px] [height:40px] [padding:0_6px_0_12px] [border-radius:14px] [border:1px_solid_#DDE1E4] [background:var(--client-surface)] [font:inherit] [font-size:13px] [font-weight:500] [color:var(--client-text)] [cursor:pointer]"
  >
    Alerte prix<span
      [style.background-color]="catalog.alert('Alerte client-account-desktop-section-2') ? '#007A6C' : '#CDD3D1'"
      class="[position:relative] [width:40px] [height:24px] [border-radius:12px] [background:var(--client-border)] [transition:background_160ms_ease]"
      ><span
        [style.left]="catalog.alert('Alerte client-account-desktop-section-2') ? '19px' : '3px'"
        class="[position:absolute] [top:3px] [left:3px] [width:18px] [height:18px] [border-radius:9px] [background:var(--client-surface)] [box-shadow:0_1px_3px_rgba(15,26,23,0.25)] [transition:left_160ms_ease]"
      ></span
    ></span>
  </button>
</article>
