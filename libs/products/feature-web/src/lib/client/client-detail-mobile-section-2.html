<section
  class="[background:var(--client-surface)] [padding:12px_14px_18px] [display:flex] [flex-direction:column] [gap:12px]"
>
  <div
    class="[position:relative] [height:290px] [border-radius:14px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
  >
    <svg
      viewBox="0 0 200 200"
      aria-hidden="true"
      class="[width:250px] [height:250px]"
      tpxVisual
      symbol="i-phone"
    ></svg>
    <button
      type="button"
      aria-label="Suivre le prix"
      aria-pressed="false"
      class="[position:absolute] [top:12px] [right:12px] [width:40px] [height:40px] [border-radius:20px] [border:0] [background:var(--client-surface)] [box-shadow:0_1px_4px_rgba(15,26,23,0.15)] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-text)]"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-d6d8d482ea7e"
      ></svg>
    </button>
    <div
      class="[position:absolute] [bottom:12px] [left:0] [right:0] [display:flex] [justify-content:center] [gap:5px]"
    >
      <span
        class="[width:18px] [height:6px] [border-radius:3px] [background:var(--client-text)]"
      ></span
      ><span
        class="[width:6px] [height:6px] [border-radius:3px] [background:#C3C9C7]"
      ></span
      ><span
        class="[width:6px] [height:6px] [border-radius:3px] [background:#C3C9C7]"
      ></span
      ><span
        class="[width:6px] [height:6px] [border-radius:3px] [background:#C3C9C7]"
      ></span>
    </div>
  </div>
  <div class="[display:flex] [flex-direction:column] [gap:4px]">
    <span
      class="[font-size:13px] [font-weight:500] [color:var(--client-action)]"
      >Samsung</span
    >
    <h1
      class="[margin:0] [font-size:22px] [line-height:1.2] [font-weight:500] [letter-spacing:-0.025em]"
    >
      Samsung Galaxy S24 128 Go
    </h1>
    <span class="[font-size:13.5px] [color:var(--client-text-tertiary)]"
      ><span class="[color:var(--client-text)] [font-weight:600]"
        >6 offres</span
      >
      de 610 à {{ ui.money(719) }}</span
    >
  </div>
  <div
    class="[border-radius:14px] [background:var(--client-mint-soft)] [padding:14px] [display:flex] [flex-direction:column] [gap:10px]"
  >
    <span
      class="[font-size:12px] [font-weight:600] [color:var(--client-action-hover)] [letter-spacing:0.02em]"
      >MEILLEUR PRIX EN NEUF</span
    >
    <div
      class="[display:flex] [align-items:flex-end] [justify-content:space-between]"
    >
      <span
        class="[font-size:30px] [line-height:1] [font-weight:600] [letter-spacing:-0.035em]"
        tpxPriceTag
        [value]="ui.money(689)"
      ></span>
      <span class="[text-align:right] [font-size:13px] [line-height:1.35]"
        ><span class="[font-weight:600]">UAC – Gombe</span><br /><span
          class="[color:var(--client-distance)] [font-weight:500]"
          >1,2 km</span
        ></span
      >
    </div>
    <span class="[font-size:12px] [color:var(--client-text-tertiary)]"
      >{{ ui.approximate(689) }} · prix confirmé par la boutique</span
    >
  </div>
</section>
