<article
  class="[padding:14px] [border-top:1px_solid_var(--client-divider)] [background:var(--client-mint-soft)] [display:flex] [flex-direction:column] [gap:10px]"
>
  <div class="[display:flex] [gap:12px] [align-items:center]">
    <span
      class="[width:42px] [height:42px] [border-radius:50%] [background:var(--client-surface)] [border:1px_solid_#E1E8E6] [overflow:hidden] [display:flex] [align-items:center] [justify-content:center] [flex-shrink:0] [box-sizing:border-box]"
      ><img
        src="/client-design/assets/logo-talaprix.png"
        alt=""
        class="[width:70%] [height:70%] [object-fit:contain]"
        tpxShopAvatar
    /></span>
    <div
      class="[flex:1] [min-width:0] [display:flex] [flex-direction:column] [gap:2px]"
    >
      <span
        class="[align-self:flex-start] [font-size:10.5px] [font-weight:600] [color:var(--client-surface)] [background:var(--client-action)] [border-radius:5px] [padding:2px_6px] [margin-bottom:2px]"
        >Meilleur prix</span
      >
      <span
        class="[font-size:15px] [font-weight:500] [white-space:nowrap] [overflow:hidden] [text-overflow:ellipsis]"
        >Jouani Congo</span
      >
      <span class="[font-size:12.5px] [color:var(--client-text-tertiary)]"
        >Kasa-Vubu ·
        <span class="[color:var(--client-distance)] [font-weight:500]"
          >4,1 km</span
        >
        · Reconditionné</span
      >
    </div>
    <span
      class="[font-size:18px] [font-weight:600] [letter-spacing:-0.02em] [font-variant-numeric:tabular-nums]"
      tpxPriceTag
      [value]="ui.money(610)"
    ></span>
  </div>
  <div class="[display:flex] [gap:8px]">
    <a
      href="#"
      class="[flex:1] [display:inline-flex] [align-items:center] [justify-content:center] [gap:6px] [height:40px] [border-radius:14px] [background:var(--client-page)] [color:var(--client-text)] [font-size:13.5px] [font-weight:500] [text-decoration:none]"
      >WhatsApp</a
    >
    <a
      routerLink="/boutiques"
      class="[flex:1] [display:inline-flex] [align-items:center] [justify-content:center] [gap:6px] [height:40px] [border-radius:14px] [background:var(--client-page)] [color:var(--client-text)] [font-size:13.5px] [font-weight:500] [text-decoration:none]"
      >Itinéraire</a
    >
    <button
      type="button"
      aria-pressed="false"
      (click)="catalog.add('Samsung Galaxy S24 128 Go', 689, 'UAC – Gombe')"
      [attr.aria-pressed]="catalog.added('Samsung Galaxy S24 128 Go')"
      class="[flex:1] [height:40px] [border-radius:14px] [font:inherit] [font-size:13.5px] [font-weight:500] [border:0] [background:var(--client-action)] [color:var(--client-surface)]"
    >
      {{ catalog.added('Samsung Galaxy S24 128 Go') ? '✓ Ajouté' : '+ Panier' }}
    </button>
  </div>
</article>
