@if (filters().length) {
<ul
  class="m-0 flex list-none flex-wrap items-center gap-2 p-0"
  aria-label="Filtres actifs"
>
  @for (filter of filters(); track filter.key) {
  <li class="animate-chip-in motion-reduce:animate-none">
    <button
      type="button"
      class="group inline-flex h-8 items-center gap-1.5 rounded-full bg-[var(--client-mint)] pl-3 pr-2 text-[13px] font-medium text-[var(--client-action)] transition duration-150 hover:bg-[var(--client-action)] hover:text-white"
      [attr.aria-label]="'Retirer le filtre ' + filter.label"
      (click)="remove.emit(filter.key)"
    >
      <span class="max-w-[220px] truncate">{{ filter.label }}</span>
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </li>
  } @if (filters().length > 1) {
  <li>
    <button
      type="button"
      class="h-8 rounded-full px-3 text-[13px] font-semibold text-[var(--client-text-secondary)] underline-offset-4 transition hover:text-[var(--client-text)] hover:underline"
      (click)="clear.emit()"
    >
      Tout effacer
    </button>
  </li>
  }
</ul>
}
