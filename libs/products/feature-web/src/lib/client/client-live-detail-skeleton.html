<div class="grid gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:gap-8">
  <div class="flex flex-col gap-4 rounded-3xl bg-[var(--client-surface)] p-5">
    <div class="aspect-square animate-pulse rounded-3xl bg-[var(--client-line)]"></div>
    <div class="h-4 w-1/3 animate-pulse rounded-full bg-[var(--client-line)]"></div>
    <div class="h-7 w-4/5 animate-pulse rounded-full bg-[var(--client-line)]"></div>
    <div class="h-9 w-1/2 animate-pulse rounded-full bg-[var(--client-line)]"></div>
  </div>
  <div class="flex flex-col gap-3">
    <div class="h-12 animate-pulse rounded-3xl bg-[var(--client-line)]"></div>
    @for (row of rows; track row) {
    <div class="h-28 animate-pulse rounded-3xl bg-[var(--client-line)]"></div>
    }
  </div>
</div>
