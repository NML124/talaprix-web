<article
  class="[position:relative] [display:flex] [flex-direction:column] [gap:6px] [padding:8px_8px_10px] [border-radius:14px] [background:var(--client-surface)]"
>
  <a
    aria-label="Samsung Galaxy S24 128 Go"
    routerLink="/produit/samsung-galaxy-s24-128-go"
    class="[position:relative] [height:136px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
    ><svg
      viewBox="0 0 200 200"
      aria-hidden="true"
      class="[width:112px] [height:112px]"
      tpxVisual
      symbol="i-phone"
    ></svg>
    <span
      class="[position:absolute] [top:8px] [left:8px] [height:22px] [padding:0_7px] [border-radius:6px] [background:var(--client-action)] [color:var(--client-surface)] [font-size:11px] [font-weight:600] [display:flex] [align-items:center]"
      >Prix en baisse</span
    >
  </a>
  <span
    aria-hidden="true"
    class="[position:absolute] [top:14px] [right:14px] [width:30px] [height:30px] [border-radius:15px] [background:var(--client-surface)] [box-shadow:0_1px_3px_rgba(15,26,23,0.12)] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-action)]"
    ><svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="currentColor"
      aria-hidden="true"
      tpxVisual
      symbol="icon-d6d8d482ea7e"
    ></svg
  ></span>
  <span
    class="[padding:0_2px] [font-size:13px] [line-height:1.35] [height:35px] [overflow:hidden] client-product-title"
    title="Samsung Galaxy S24 128 Go"
    >Samsung Galaxy S24 128 Go</span
  >
  <span class="[padding:0_2px] [display:flex] [align-items:baseline] [gap:6px]"
    ><span
      class="[font-size:16px] [font-weight:700] [font-variant-numeric:tabular-nums]"
      tpxPriceTag
      [value]="ui.money(610)"
    ></span
    ><span
      class="[font-size:12px] [color:var(--client-subtle)] [text-decoration:line-through]"
      tpxPriceTag
      [value]="ui.money(629)"
    ></span
  ></span>
  <button
    type="button"
    role="switch"
    aria-checked="true"
    (click)="catalog.toggleAlert('Alerte client-account-mobile-section-3')"
    [attr.aria-checked]="catalog.alert('Alerte client-account-mobile-section-3')"
    class="[display:flex] [align-items:center] [justify-content:space-between] [height:36px] [padding:0_4px_0_10px] [border-radius:12px] [border:1px_solid_#DDE1E4] [background:var(--client-surface)] [font:inherit] [font-size:12.5px] [font-weight:500] [color:var(--client-text)] [cursor:pointer]"
  >
    Alerte prix<span
      [style.background-color]="catalog.alert('Alerte client-account-mobile-section-3') ? '#007A6C' : '#CDD3D1'"
      class="[position:relative] [width:38px] [height:22px] [border-radius:11px] [background:var(--client-action)]"
      ><span
        [style.left]="catalog.alert('Alerte client-account-mobile-section-3') ? '19px' : '3px'"
        class="[position:absolute] [top:3px] [left:19px] [width:16px] [height:16px] [border-radius:8px] [background:var(--client-surface)] [box-shadow:0_1px_3px_rgba(15,26,23,0.25)]"
      ></span
    ></span>
  </button>
</article>
