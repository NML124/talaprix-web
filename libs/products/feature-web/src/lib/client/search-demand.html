@if (status() === 'done') {
<p
  role="status"
  class="m-0 inline-flex items-center gap-2 rounded-2xl bg-[var(--client-mint)] px-4 py-3 text-sm font-medium text-[var(--client-action)] animate-fade-in motion-reduce:animate-none"
>
  <svg lucideCheck size="16" aria-hidden="true"></svg>{{ message() }}
</p>
} @else {
<div class="flex flex-col items-center gap-3">
  <label
    class="inline-flex cursor-pointer items-center gap-2 text-sm text-[var(--client-text-secondary)]"
  >
    <input
      type="checkbox"
      class="size-4 accent-[var(--client-action)]"
      [checked]="notify()"
      (change)="toggleNotify($event)"
    />
    Me prévenir quand il est disponible
  </label>
  <button
    type="button"
    class="inline-flex h-10 items-center justify-center gap-2 rounded-[15px] bg-[var(--client-action)] px-5 text-[14.5px] font-semibold text-white no-underline transition duration-150 hover:bg-[var(--client-action-hover)] active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
    [disabled]="status() === 'sending'"
    (click)="report()"
  >
    @if (status() === 'sending') {
    <svg
      lucideLoaderCircle
      size="16"
      class="animate-spin motion-reduce:animate-none"
      aria-hidden="true"
    ></svg>
    } Signaler ce produit
  </button>
  @if (status() === 'error') {
  <p role="alert" class="m-0 text-sm text-[var(--client-error)]">
    {{ message() }}
  </p>
  }
</div>
}
