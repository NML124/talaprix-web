<main class="min-h-screen bg-[#f8faf9] pb-16 pt-4 text-[#1d2422] sm:pt-6">
  <section class="mx-auto max-w-[1536px] px-3 sm:px-5 lg:px-6">
    <tpx-category-hero [count]="categories().length" />
    @if (status() === 'success') {
    <tpx-category-popular [categories]="categories()" />
    <tpx-category-all [families]="families()" />
    } @else {
    <tpx-category-status
      [status]="status()"
      [error]="error()"
      (retry)="retry()"
    />
    }
  </section>
</main>
