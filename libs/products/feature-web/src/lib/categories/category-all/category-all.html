<section class="mt-10">
  <div class="flex items-end justify-between gap-3">
    <div>
      <h2 class="text-[23px] font-black tracking-tight sm:text-[27px]">
        Toutes les catégories
      </h2>

    </div>
  </div>
  <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
    @for (family of families(); track family.name) {
    <section
      class="rounded-[18px] border border-[#dce5e3] bg-white p-3.5 sm:p-4"
    >
      <a
        routerLink="/products"
        class="group flex items-start justify-between gap-3 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#008f82] focus-visible:ring-offset-2"
      >
        <h3
          class="text-[17px] font-black leading-5 tracking-tight text-[#1d2422]"
        >
          {{ family.name }}
        </h3>
        <svg
          aria-hidden="true"
          viewBox="0 0 16 16"
          class="mt-0.5 h-5 w-5 shrink-0 stroke-[#1d2422] stroke-[1.7] transition-transform group-hover:translate-x-0.5"
        >
          <path d="m5 2.75 5.25 5.25L5 13.25" fill="none" />
        </svg>
      </a>
      <div class="mt-3.5 grid grid-cols-2 gap-x-2.5 gap-y-4">
        @for (category of family.categories.slice(0, 4); track category.id) {
        <a
          [routerLink]="'/products'"
          [queryParams]="{ category: category.id }"
          class="group block min-w-0 rounded-[12px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#008f82] focus-visible:ring-offset-2"
        >
          <div
            class="aspect-[1.28] overflow-hidden rounded-[11px] bg-[#eef3f2]"
          >
            @if (category.image) {
            <img
              [src]="category.image"
              [alt]="category.name"
              class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-[1.035]"
            />
            } @else {
            <img
              src="/assets/images/logo_app.png"
              [alt]="category.name"
              class="h-full w-full object-contain p-7 opacity-55"
            />
            }
          </div>
          <p
            class="mt-2 line-clamp-2 text-[13px] font-medium leading-[1.25] text-[#35413e]"
          >
            {{ category.name }}
          </p>
        </a>
        }
      </div>
    </section>
    }
  </div>
</section>
