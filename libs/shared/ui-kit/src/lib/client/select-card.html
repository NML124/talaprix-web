<button
  type="button"
  class="client-select-trigger"
  [class.client-select-compact]="compact()"
  [attr.aria-label]="label()"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <span class="min-w-0 truncate">{{ caption() }}</span
  ><svg
    class="size-4 shrink-0 transition-transform"
    [class.rotate-180]="open()"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>
@if(open()) {
<div class="client-select-menu" role="listbox" [attr.aria-label]="label()">
  @for(option of options();track option.value;let index=$index){<button
    type="button"
    role="option"
    [attr.aria-selected]="current()===option.value"
    class="client-select-option"
    (focus)="active.set(index)"
    (click)="choose(option.value)"
  >
    <span class="min-w-0 flex-1 truncate">{{option.label}}</span
    >@if(current()===option.value){<svg
      class="size-4 shrink-0 text-[#007A6C]"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="m5 12 4 4L19 6" /></svg
    >}</button
  >}
</div>
}
