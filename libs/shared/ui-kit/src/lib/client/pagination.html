@if (totalPages() > 1) {
<nav
  [attr.aria-label]="label()"
  class="flex items-center justify-center gap-1.5"
>
  <button
    type="button"
    aria-label="Page précédente"
    [disabled]="page() <= 1"
    (click)="go(page() - 1)"
    class="inline-flex size-10 items-center justify-center rounded-[15px] border border-[var(--client-line)] bg-[var(--client-surface)] text-[var(--client-text)] transition duration-150 hover:bg-[var(--client-tile)] active:scale-[0.96] disabled:pointer-events-none disabled:opacity-40"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m15 6-6 6 6 6" />
    </svg>
  </button>
  @for (item of items(); track $index) { @if (item === null) {
  <span aria-hidden="true" class="w-6 text-center text-[var(--client-subtle)]"
    >…</span
  >
  } @else {
  <button
    type="button"
    [attr.aria-current]="item === page() ? 'page' : null"
    [attr.aria-label]="'Page ' + item"
    (click)="go(item)"
    class="inline-flex h-10 min-w-10 items-center justify-center rounded-[15px] px-3 text-[14.5px] font-semibold tabular-nums transition duration-150 active:scale-[0.96]"
    [class]="
      item === page()
        ? 'bg-[var(--client-action)] text-white'
        : 'text-[var(--client-text-secondary)] hover:bg-[var(--client-surface)]'
    "
  >
    {{ item }}
  </button>
  } }
  <button
    type="button"
    aria-label="Page suivante"
    [disabled]="page() >= totalPages()"
    (click)="go(page() + 1)"
    class="inline-flex size-10 items-center justify-center rounded-[15px] border border-[var(--client-line)] bg-[var(--client-surface)] text-[var(--client-text)] transition duration-150 hover:bg-[var(--client-tile)] active:scale-[0.96] disabled:pointer-events-none disabled:opacity-40"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m9 6 6 6-6 6" />
    </svg>
  </button>
</nav>
}
