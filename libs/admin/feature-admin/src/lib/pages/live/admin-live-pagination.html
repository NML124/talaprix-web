<div class="mt-5 flex items-center justify-between gap-3">
  <button
    class="btn btn-secondary"
    type="button"
    [disabled]="page() <= 1"
    (click)="changed.emit(page() - 1)"
  >
    Précédent
  </button>
  <span class="text-sm text-[var(--text-2)]"
    >Page {{ page() }} sur {{ totalPages() }}</span
  >
  <button
    class="btn btn-secondary"
    type="button"
    [disabled]="page() >= totalPages()"
    (click)="changed.emit(page() + 1)"
  >
    Suivant
  </button>
</div>
