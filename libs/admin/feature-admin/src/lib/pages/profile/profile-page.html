<tp-admin-page-header
  title="Mon compte"
  subtitle="Informations personnelles et accès à l’espace administration."
>
  <button type="button" class="btn btn-primary" (click)="save()">
    Enregistrer les modifications
  </button>
</tp-admin-page-header>
@if(toast()){
<div class="toast" role="status">{{toast()}}</div>
}@if(error()){
<div class="toast error" role="alert">{{error()}}</div>
}
<div
  class="grid items-start gap-6 lg:grid-cols-[minmax(0,1.5fr)_minmax(18rem,0.8fr)]"
>
  <section class="card grid content-start gap-6">
    <div class="flex items-center gap-4 border-b border-[var(--line)] pb-5">
      <span class="avatar brand size-16 text-xl">{{name().slice(0,1)}}</span>
      <div class="min-w-0">
        <h2 class="truncate text-xl font-semibold text-[var(--text-1)]">
          {{name()}}
        </h2>
        <span class="badge success mt-2">Super administrateur · Global</span>
      </div>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="field"
        >Nom complet<input
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
      /></label>
      <label class="field"
        >Email professionnel<input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
      /></label>
      <label class="field"
        >Téléphone<input
          type="tel"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
      /></label>
    </div>
  </section>
  <aside class="card grid content-start gap-4">
    <h2 class="text-base font-semibold text-[var(--text-1)]">
      Accès au panneau
    </h2>
    <p class="text-sm leading-relaxed text-[var(--text-2)]">
      Votre compte dispose d’un accès global à l’administration TalaPrix.
    </p>
    <div
      class="grid gap-1 rounded-xl border border-[var(--line)] bg-[var(--surface-muted)] p-4"
    >
      <span class="text-xs text-[var(--text-2)]">Adresse de connexion</span>
      <strong class="break-all text-sm text-[var(--text-1)]"
        >{{email()}}</strong
      >
    </div>
  </aside>
</div>
