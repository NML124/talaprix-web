<figure
  class="scrape-network"
  role="img"
  aria-label="Simulation : une araignée explore la toile, analyse des annonces et collecte les informations des vendeurs"
>
  <svg
    class="scrape-network-art"
    viewBox="0 0 720 170"
    aria-hidden="true"
    focusable="false"
  >
    <defs>
      <linearGradient id="scrape-thread" x1="0" x2="1">
        <stop offset="0" stop-color="var(--brand)" stop-opacity=".16" />
        <stop offset=".55" stop-color="var(--brand)" stop-opacity=".72" />
        <stop offset="1" stop-color="var(--brand)" stop-opacity=".2" />
      </linearGradient>
      <radialGradient id="spider-shell" cx="35%" cy="25%">
        <stop stop-color="#ffb2d0" />
        <stop offset=".34" stop-color="#ff4d91" />
        <stop offset="1" stop-color="#7d174d" />
      </radialGradient>
    </defs>

    <g
      class="scrape-web-lines"
      fill="none"
      stroke="url(#scrape-thread)"
      stroke-width="1.5"
    >
      <path
        d="M40 32 170 84 318 27 486 82 672 30M40 140 170 84 318 143 486 82 672 140"
      />
      <path d="M170 16v136M318 16v138M486 14v138M40 32v108M672 30v110" />
      <path d="m40 32 130 108 148-113 168 113L672 30M40 140 318 27l354 113" />
      <path class="scrape-data-thread" d="M40 32 170 84 318 27 486 82 672 30" />
    </g>

    <g class="scrape-web-node" transform="translate(170 84)">
      <circle r="8" />
      <circle class="node-core" r="3" />
    </g>
    <g class="scrape-web-node" transform="translate(318 27)">
      <circle r="7" />
      <circle class="node-core" r="2.5" />
    </g>
    <g class="scrape-web-node" transform="translate(486 82)">
      <circle r="8" />
      <circle class="node-core" r="3" />
    </g>
    <g class="scrape-web-node" transform="translate(672 30)">
      <circle r="7" />
      <circle class="node-core" r="2.5" />
    </g>

    <g class="scrape-capture-card" transform="translate(64 91)">
      <rect class="capture-card-bg" width="83" height="47" rx="9" />
      <rect class="capture-image" x="7" y="7" width="22" height="22" rx="5" />
      <path d="M36 12h38M36 19h30M8 36h66" />
    </g>
    <g
      class="scrape-capture-card capture-card-two"
      transform="translate(532 96)"
    >
      <rect class="capture-card-bg" width="83" height="47" rx="9" />
      <circle class="capture-image" cx="18" cy="18" r="10" />
      <path d="M36 12h38M36 19h30M8 36h66" />
    </g>

    <g class="scrape-spider-walker">
      <animateMotion
        dur="9s"
        repeatCount="indefinite"
        rotate="auto"
        calcMode="linear"
        keyTimes="0;0.22;0.32;0.49;0.59;0.76;0.86;1"
        keyPoints="0;0.25;0.25;0.5;0.5;0.75;0.75;1"
        path="M 40,32 C 86,51 126,81 170,84 S 269,50 318,27 S 430,54 486,82 S 615,49 672,30"
      />
      <g class="scrape-spider">
        <circle class="spider-scan" r="25" />
        <g class="spider-legs" aria-hidden="true">
          <g
            class="spider-leg leg-left leg-phase-a"
            transform="translate(-5 -4)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0-10-11" />
              <g class="leg-foot" transform="translate(-10 -11)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0-8 7" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-right leg-phase-b"
            transform="translate(-6 -1)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0-13-4" />
              <g class="leg-foot" transform="translate(-13 -4)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0-8 5" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-left leg-phase-b"
            transform="translate(-6 2)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0-13 4" />
              <g class="leg-foot" transform="translate(-13 4)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0-8-5" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-right leg-phase-a"
            transform="translate(-4 5)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0-10 11" />
              <g class="leg-foot" transform="translate(-10 11)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0-8-7" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-right leg-phase-b"
            transform="translate(5 -4)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0 10-11" />
              <g class="leg-foot" transform="translate(10 -11)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0 8 7" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-left leg-phase-a"
            transform="translate(6 -1)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0 13-4" />
              <g class="leg-foot" transform="translate(13 -4)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0 8 5" />
              </g>
            </g>
          </g>
          <g
            class="spider-leg leg-right leg-phase-a"
            transform="translate(6 2)"
          >
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0 13 4" />
              <g class="leg-foot" transform="translate(13 4)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0 8-5" />
              </g>
            </g>
          </g>
          <g class="spider-leg leg-left leg-phase-b" transform="translate(4 5)">
            <g class="leg-pivot">
              <path class="leg-upper" d="M0 0 10 11" />
              <g class="leg-foot" transform="translate(10 11)">
                <circle class="leg-joint" r="1.25" />
                <path class="leg-lower" d="M0 0 8-7" />
              </g>
            </g>
          </g>
        </g>
        <ellipse class="spider-abdomen" cx="-5" cy="0" rx="8.5" ry="6.8" />
        <path class="spider-segment" d="M-10-3q5 3 0 6M-7-5q5 5 0 10" />
        <circle class="spider-head" cx="5" cy="0" r="5.3" />
        <circle class="spider-eye" cx="7.2" cy="-2.2" r="1.1" />
        <circle class="spider-eye" cx="8.1" cy="0" r=".72" />
        <circle class="spider-eye" cx="7.2" cy="2.2" r="1.1" />
        <path class="spider-sensor" d="M8-3.8q4-5 5-2M8 3.8q4 5 5 2M9 1l2 2" />
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0;0 -2;0 0"
          dur=".38s"
          repeatCount="indefinite"
        />
      </g>
    </g>
  </svg>
  <figcaption>
    <span class="scrape-signal-dot"></span>
    L’araignée explore les sources publiques et remonte les annonces
    <span class="scrape-sim-label">animation simulée</span>
  </figcaption>
</figure>
