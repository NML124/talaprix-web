<tp-admin-page-header
  title="Sélections TalaPrix"
  subtitle="Mises en avant éditoriales du catalogue."
  ><button class="btn btn-primary" type="button" (click)="newPromotion()">
    <svg lucidePlus size="15" aria-hidden="true"></svg>Créer une sélection
  </button></tp-admin-page-header
>
@if(toast()){
<div class="toast" role="status">{{toast()}}</div>
}
<tp-promo-cards
  [promotions]="promotions()"
  (preview)="openPromotion($event,'preview')"
  (edit)="openPromotion($event,'edit')"
/>
@if(promotionDialog();as current){
<tp-promo-dialog
  [promotion]="current.promotion"
  [mode]="current.mode"
  (closed)="promotionDialog.set(null)"
  (saved)="savePromotion($event)"
/>
}
