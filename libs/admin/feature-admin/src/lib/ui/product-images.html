<div class="product-images">
  <div class="image-list">
    @for (image of images(); track image; let index = $index) {
    <div class="image-tile">
      <img [src]="imagePath(image)" [alt]="'Photo du produit ' + (index + 1)" />
      <button
        type="button"
        class="image-remove"
        [attr.aria-label]="'Retirer la photo ' + (index + 1)"
        (click)="remove(index)"
      >
        ×
      </button>
    </div>
    } @if (images().length < 5) {
    <label class="image-add">
      <span aria-hidden="true">＋</span>
      <span>Ajouter des photos</span>
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
        (change)="onFiles($event)"
      />
    </label>
    }
  </div>
  <small class="muted"
    >Jusqu’à 5 photos · JPG, PNG ou WebP · 5 Mo par photo. La première est la
    couverture.</small
  >
  @if (error()) {
  <p class="image-error" role="alert">{{ error() }}</p>
  }
</div>
