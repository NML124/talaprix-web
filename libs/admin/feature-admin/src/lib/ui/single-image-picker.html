<div class="image-list" aria-label="Image sélectionnée">
  @if(image()) {
  <div class="image-tile">
    <img [src]="imagePath(image())" alt="Aperçu de l’image" /><label
      class="image-replace"
      >Remplacer<input
        type="file"
        class="sr-only"
        accept="image/jpeg,image/png,image/webp"
        (change)="choose($event)" /></label
    >@if (allowClear()) {<button
      type="button"
      class="image-remove"
      aria-label="Retirer le visuel"
      (click)="clear()"
    >
      ×</button
    >}
  </div>
  } @if(!image()){
  <label class="image-add"
    ><span aria-hidden="true">＋</span>Ajouter une image<input
      type="file"
      accept="image/jpeg,image/png,image/webp"
      (change)="choose($event)" /></label
  >}
</div>
@if(error()) {
<p class="image-error" role="alert">{{error()}}</p>
} @if (showHint()) {<small class="muted">JPG, PNG ou WebP · 5 Mo maximum.</small
>}
