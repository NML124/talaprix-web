<div
  class="admin-global-search relative"
  (document:click)="onOutside($event)"
  (document:keydown.escape)="open.set(false)"
>
  <label class="search topbar-search w-full"
    ><svg lucideSearch size="16" aria-hidden="true"></svg>
    <span class="sr-only">Rechercher dans TalaPrix</span>
    <input
      type="search"
      class="appearance-none [&::-webkit-search-cancel-button]:hidden"
      placeholder="Rechercher…"
      aria-label="Rechercher un produit, une boutique ou un module"
      [value]="query()"
      (input)="onInput($event)"
      (focus)="open.set(true)"
      (keydown.enter)="onEnter()"
      [attr.aria-expanded]="open() && !!query().trim()"
      aria-controls="admin-search-results"
      aria-autocomplete="list"
    />
    @if (query()) {
    <button
      type="button"
      class="admin-search-clear grid shrink-0 place-items-center border-0 bg-transparent p-1 text-[var(--text-2)]"
      aria-label="Effacer la recherche"
      (click)="query.set(''); open.set(false)"
    >
      <svg lucideX size="15" aria-hidden="true"></svg>
    </button>
    }
  </label>
  @if (open() && query().trim()) {
  <div
    id="admin-search-results"
    class="admin-search-results absolute top-[calc(100%+8px)] left-0 z-50 max-h-[min(62vh,480px)] w-[min(460px,calc(100vw-32px))] overflow-y-auto rounded-[var(--radius-lg)] border border-[var(--line)] bg-[var(--surface)] p-2 shadow-[var(--shadow-float)] max-[820px]:right-0 max-[820px]:left-auto"
    role="listbox"
    aria-label="Résultats de recherche"
  >
    @for (group of groups(); track group) {
    <div
      class="admin-search-group border-[var(--line)] [&:not(:first-child)]:border-t"
    >
      <p class="mx-3 my-2 text-xs font-semibold text-[var(--text-2)]">
        {{group}}
      </p>
      @for (result of groupResults(group); track result.path + result.label) {
      <button
        class="flex w-full items-center justify-between gap-3 rounded-[var(--radius-md)] border-0 bg-transparent px-3 py-2 text-left text-[var(--text)] hover:bg-[var(--surface-muted)] focus-visible:bg-[var(--surface-muted)] max-[560px]:grid max-[560px]:gap-0"
        type="button"
        role="option"
        [attr.aria-label]="result.label + ', ' + result.detail"
        (click)="navigate(result)"
      >
        <strong>{{result.label}}</strong
        ><small
          class="whitespace-nowrap text-[var(--text-2)] max-[560px]:whitespace-normal"
          >{{result.detail}}</small
        >
      </button>
      }
    </div>
    } @empty {
    <p class="admin-search-empty m-0 p-4 text-[var(--text-2)]">
      Aucun résultat. Essayez un nom de produit, une boutique ou un module.
    </p>
    }
  </div>
  }
</div>
