<article
  class="grid gap-3 py-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center"
>
  <div class="min-w-0">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3 class="text-sm font-black text-[#172522]">{{ item().name }}</h3>
        <p class="mt-0.5 text-xs text-[#687572]">{{ item().subtitle }}</p>
      </div>
      <p class="shrink-0 text-sm font-black text-[#172522]">
        {{ formatPrice(item().unitPrice * item().quantity, 'CDF') }}
      </p>
    </div>
    <p class="mt-2 text-[11px] font-semibold text-[#008674]">
      − {{ formatPrice(item().saving * item().quantity, 'CDF') }} vs prix
      habituel
    </p>
  </div>
  <div class="flex items-center justify-between gap-3 sm:justify-end">
    <div class="flex items-center rounded-lg border border-[#dfe7e5] bg-white">
      <button
        type="button"
        (click)="quantityChange.emit(-1)"
        class="grid h-8 w-8 place-items-center text-[#52605c] hover:bg-[#f2f7f5] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#009788]"
        [attr.aria-label]="'Retirer une unité de ' + item().name"
      >
        <svg lucideMinus size="14"></svg>
      </button>
      <span
        class="min-w-7 border-x border-[#dfe7e5] px-2 py-1 text-center text-xs font-black"
        >{{ item().quantity }}</span
      >
      <button
        type="button"
        (click)="quantityChange.emit(1)"
        class="grid h-8 w-8 place-items-center text-[#52605c] hover:bg-[#f2f7f5] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#009788]"
        [attr.aria-label]="'Ajouter une unité de ' + item().name"
      >
        <svg lucidePlus size="14"></svg>
      </button>
    </div>
    <button
      type="button"
      (click)="itemRemove.emit()"
      class="grid h-8 w-8 place-items-center rounded-lg text-[#6b7774] hover:bg-red-50 hover:text-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
      [attr.aria-label]="'Supprimer ' + item().name"
    >
      <svg lucideTrash2 size="16"></svg>
    </button>
  </div>
</article>
