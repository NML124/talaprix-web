<main class="min-h-screen bg-[#f8faf9] pb-14 pt-4 text-[#172522]">
  <section class="mx-auto max-w-[1536px] px-3 sm:px-5 lg:px-6">
    <a
      routerLink="/products"
      class="text-xs font-semibold text-[#008b7b] hover:underline"
      >← Continuer mes achats</a
    >
    <header class="mt-3">
      <h1 class="text-[32px] font-black tracking-tight sm:text-[42px]">
        Mon panier
        <span class="text-lg font-semibold text-[#60706c]"
          >({{ summary().itemCount }} articles)</span
        >
      </h1>
      <p class="text-sm text-[#687572]">
        Vérifiez vos articles et finalisez votre commande au meilleur prix.
      </p>
    </header>
    @if (items().length) {
    <section
      class="mt-5 grid gap-4 xl:grid-cols-[minmax(0,1.9fr)_minmax(320px,.75fr)]"
    >
      <div class="space-y-3">
        @for (item of items(); track item.id) {<tpx-cart-line
          [item]="item"
          (quantityChange)="changeQuantity(item, $event)"
          (itemRemove)="remove(item)"
        />}
      </div>
      <tpx-cart-summary [summary]="summary()" />
    </section>
    } @else {<tpx-cart-empty />}
  </section>
</main>
