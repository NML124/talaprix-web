<div class="client-fixed-nav fixed inset-x-0 bottom-0 z-20">
  <div
    class="[background:var(--client-surface)] [box-shadow:0_-1px_0_var(--client-line)] [padding:12px_14px] [display:flex] [align-items:center] [gap:12px]"
  >
    <span class="[flex:1] [display:flex] [flex-direction:column] [gap:1px]"
      ><span class="[font-size:12px] [color:var(--client-muted)]"
        >Total · {{ cart.groups().length }} boutiques</span
      ><span class="[display:flex] [align-items:baseline] [gap:6px]"
        ><span
          class="[font-size:21px] [font-weight:700] [font-variant-numeric:tabular-nums]"
          tpxPriceTag
          [value]="ui.money(cart.originalTotal())"
        ></span></span
    ></span>
    <button
      type="button"
      (click)="cart.optimize()"
      [disabled]="cart.loading()"
      class="[height:54px] [padding:0_16px] [border:0] [border-radius:20px] [background:var(--client-action)] [color:var(--client-surface)] [font:inherit] [font-size:14.5px] [font-weight:600] [display:flex] [align-items:center] [gap:8px]"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-57f369db04fb"
      ></svg
      >Optimiser mes achats
    </button>
  </div>
  <nav
    aria-label="Navigation principale"
    class="[width:100%] [height:74px] [background:var(--client-surface)] [box-shadow:0_-1px_0_var(--client-line)] [display:grid] [grid-template-columns:repeat(5,_minmax(0,_1fr))] [padding-bottom:10px] [box-sizing:border-box]"
  >
    <a
      aria-current="false"
      routerLink="/"
      class="[position:relative] [display:flex] [flex-direction:column] [align-items:center] [justify-content:center] [gap:3px] [color:var(--client-muted)] [text-decoration:none] [font-size:11px] [font-weight:500]"
      ><svg
        width="23"
        height="23"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-fcfd745161df"
      ></svg
      >Accueil<span
        class="[position:absolute] [top:0] [width:28px] [height:3px] [border-radius:0_0_3px_3px] [background:transparent]"
      ></span
    ></a>
    <a
      aria-current="false"
      routerLink="/categories"
      class="[position:relative] [display:flex] [flex-direction:column] [align-items:center] [justify-content:center] [gap:3px] [color:var(--client-muted)] [text-decoration:none] [font-size:11px] [font-weight:500]"
      ><svg
        width="23"
        height="23"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-e9103d8b817b"
      ></svg
      >Catégories<span
        class="[position:absolute] [top:0] [width:28px] [height:3px] [border-radius:0_0_3px_3px] [background:transparent]"
      ></span
    ></a>
    <a
      aria-current="false"
      routerLink="/boutiques"
      class="[position:relative] [display:flex] [flex-direction:column] [align-items:center] [justify-content:center] [gap:3px] [color:var(--client-muted)] [text-decoration:none] [font-size:11px] [font-weight:500]"
      ><svg
        width="23"
        height="23"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-3513dee1999b"
      ></svg
      >Carte<span
        class="[position:absolute] [top:0] [width:28px] [height:3px] [border-radius:0_0_3px_3px] [background:transparent]"
      ></span
    ></a>
    <a
      aria-current="page"
      routerLink="/panier"
      class="[position:relative] [display:flex] [flex-direction:column] [align-items:center] [justify-content:center] [gap:3px] [color:var(--client-action)] [text-decoration:none] [font-size:11px] [font-weight:600]"
      ><svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-1670e5a4781a"
      ></svg
      >Panier<span
        class="[position:absolute] [top:0] [width:28px] [height:3px] [border-radius:0_0_3px_3px] [background:var(--client-action)]"
      ></span
    ></a>
    <a
      aria-current="false"
      routerLink="/compte"
      class="[position:relative] [display:flex] [flex-direction:column] [align-items:center] [justify-content:center] [gap:3px] [color:var(--client-muted)] [text-decoration:none] [font-size:11px] [font-weight:500]"
      ><svg
        width="23"
        height="23"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-5c4ee80f232c"
      ></svg
      >Compte<span
        class="[position:absolute] [top:0] [width:28px] [height:3px] [border-radius:0_0_3px_3px] [background:transparent]"
      ></span
    ></a>
  </nav>
</div>
