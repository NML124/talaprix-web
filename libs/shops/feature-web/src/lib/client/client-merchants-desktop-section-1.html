<header class="[background:var(--client-dark)]">
  <div
    class="[max-width:1280px] [margin:0_auto] [padding:0_32px] [box-sizing:border-box] [height:72px] [display:flex] [align-items:center] [gap:20px]"
  >
    <a
      aria-label="Talaprix, accueil"
      routerLink="/"
      class="[display:flex] [align-items:center] [gap:10px] [text-decoration:none] [color:var(--client-surface)]"
    >
      <span
        class="[width:38px] [height:38px] [border-radius:10px] [background:var(--client-surface)] [display:flex] [align-items:center] [justify-content:center]"
        ><img
          src="/client-design/assets/logo-talaprix.png"
          alt=""
          class="[width:30px] [height:30px] [object-fit:contain]"
          tpxShopAvatar
      /></span>
      <span class="[font-size:20px] [font-weight:500] [letter-spacing:-0.02em]"
        >Talaprix</span
      >
      <span
        class="[font-size:13px] [font-weight:500] [color:#7FD3C6] [border-left:1px_solid_rgba(255,255,255,0.2)] [padding-left:12px] [margin-left:2px]"
        >Commerçants</span
      >
    </a>
    <div
      class="[margin-left:auto] [display:flex] [align-items:center] [gap:10px]"
    >
      <a
        routerLink="/"
        class="[font-size:14px] [font-weight:500] [color:#B5C9C4] [text-decoration:none] [padding:0_8px]"
        >Retour au site</a
      >
      <a
        href="#"
        class="[display:inline-flex] [align-items:center] [height:40px] [padding:0_16px] [border-radius:14px] [border:1px_solid_rgba(255,255,255,0.28)] [color:var(--client-surface)] [font-size:14px] [font-weight:500] [text-decoration:none] client-btn-g"
        >Espace commerçant</a
      >
    </div>
  </div>
</header>
