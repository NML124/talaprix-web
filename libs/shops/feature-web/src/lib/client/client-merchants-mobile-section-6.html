<section
  aria-labelledby="m-faq"
  class="[background:var(--client-surface)] [margin-top:10px] [padding:28px_16px_20px]"
>
  <h2
    id="m-faq"
    class="[margin:0_0_8px] [font-size:22px] [font-weight:600] [letter-spacing:-0.02em]"
  >
    Questions fréquentes
  </h2>
  <div class="[border-bottom:1px_solid_#EEF0EF]">
    <button
      type="button"
      aria-expanded="true"
      class="[width:100%] [min-height:56px] [display:flex] [align-items:center] [justify-content:space-between] [gap:12px] [border:0] [background:transparent] [padding:12px_0] [font:inherit] [font-size:15px] [font-weight:600] [color:var(--client-text)] [text-align:left] [cursor:pointer]"
    >
      L'inscription est-elle gratuite ?<span
        class="[display:flex] [transform:rotate(180deg)] [color:var(--client-text-tertiary)] [flex-shrink:0]"
        ><svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg
      ></span>
    </button>
    <p
      class="[margin:0_0_16px] [font-size:14px] [line-height:1.6] [color:var(--client-text-tertiary)]"
    >
      Oui. L'inscription et la fiche boutique sont gratuites. Des options de
      mise en avant existent ; nous vous les présentons si vous le souhaitez.
    </p>
  </div>
  <div class="[border-bottom:1px_solid_#EEF0EF]">
    <button
      type="button"
      aria-expanded="false"
      class="[width:100%] [min-height:56px] [display:flex] [align-items:center] [justify-content:space-between] [gap:12px] [border:0] [background:transparent] [padding:12px_0] [font:inherit] [font-size:15px] [font-weight:600] [color:var(--client-text)] [text-align:left] [cursor:pointer]"
    >
      Qui met à jour mes prix ?<span
        class="[display:flex] [transform:none] [color:var(--client-text-tertiary)] [flex-shrink:0]"
        ><svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg
      ></span>
    </button>
  </div>
  <div class="[border-bottom:1px_solid_#EEF0EF]">
    <button
      type="button"
      aria-expanded="false"
      class="[width:100%] [min-height:56px] [display:flex] [align-items:center] [justify-content:space-between] [gap:12px] [border:0] [background:transparent] [padding:12px_0] [font:inherit] [font-size:15px] [font-weight:600] [color:var(--client-text)] [text-align:left] [cursor:pointer]"
    >
      Je n'ai pas de site internet. Puis-je m'inscrire ?<span
        class="[display:flex] [transform:none] [color:var(--client-text-tertiary)] [flex-shrink:0]"
        ><svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg
      ></span>
    </button>
  </div>
  <div class="[border-bottom:1px_solid_#EEF0EF]">
    <button
      type="button"
      aria-expanded="false"
      class="[width:100%] [min-height:56px] [display:flex] [align-items:center] [justify-content:space-between] [gap:12px] [border:0] [background:transparent] [padding:12px_0] [font:inherit] [font-size:15px] [font-weight:600] [color:var(--client-text)] [text-align:left] [cursor:pointer]"
    >
      Puis-je retirer ma boutique de Talaprix ?<span
        class="[display:flex] [transform:none] [color:var(--client-text-tertiary)] [flex-shrink:0]"
        ><svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg
      ></span>
    </button>
  </div>
</section>
