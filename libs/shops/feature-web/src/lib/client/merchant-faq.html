<section
  id="faq"
  class="merchant-faq mx-auto max-w-[880px] px-4 py-16 min-[768px]:px-8"
  aria-labelledby="merchant-faq-title"
>
  <h2
    id="merchant-faq-title"
    class="mb-5 text-[clamp(22px,2vw,30px)] font-semibold tracking-[-0.02em]"
  >
    Questions fréquentes
  </h2>
  <div
    class="overflow-hidden rounded-[20px] border border-[var(--client-line)] bg-white"
  >
    @for (item of questions; track item.question) {
    <details
      class="group border-b border-[var(--client-divider)] last:border-b-0"
    >
      <summary
        class="flex min-h-14 cursor-pointer list-none items-center justify-between gap-4 px-5 py-3 text-left text-[15px] font-medium marker:hidden hover:bg-[var(--client-tile)] focus-visible:outline-2 focus-visible:outline-offset-[-3px] focus-visible:outline-[var(--client-brand)]"
      >
        <span>{{ item.question }}</span
        ><span
          aria-hidden="true"
          class="text-xl leading-none text-[var(--client-muted)] group-open:rotate-45"
          >+</span
        >
      </summary>
      <p
        class="m-0 max-w-[72ch] px-5 pb-5 text-sm leading-[1.65] text-[var(--client-text-tertiary)]"
      >
        {{ item.answer }}
      </p>
    </details>
    }
  </div>
</section>
<section
  id="contact"
  class="mx-auto max-w-[880px] px-4 pb-20 min-[768px]:px-8"
  aria-labelledby="merchant-contact-title"
>
  <div
    class="flex flex-col gap-5 rounded-[20px] bg-[var(--client-mint-soft)] p-6 min-[768px]:flex-row min-[768px]:items-center min-[768px]:justify-between min-[768px]:p-8"
  >
    <div>
      <h2
        id="merchant-contact-title"
        class="m-0 text-2xl font-semibold tracking-[-0.02em]"
      >
        Besoin de nous parler ?
      </h2>
      <p class="mt-2 mb-0 text-sm leading-6 text-[var(--client-text-tertiary)]">
        Une question sur votre boutique, un produit ou un prix ? Notre équipe
        vous répond.
      </p>
    </div>
    <div class="flex shrink-0 flex-wrap gap-2">
      <a
        class="merchant-action merchant-action-primary"
        href="mailto:support@talaprix.com"
        >Envoyer un e-mail</a
      >
      <a
        class="merchant-action merchant-action-secondary"
        href="https://wa.me/243980000147"
        target="_blank"
        rel="noopener noreferrer"
        >WhatsApp</a
      >
    </div>
  </div>
</section>
