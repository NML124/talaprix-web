<section
  aria-labelledby="faq"
  class="[max-width:880px] [margin:0_auto] [padding:88px_32px_96px] [box-sizing:border-box]"
>
  <h2
    id="faq"
    class="[margin:0_0_20px] [font-size:28px] [font-weight:500] [letter-spacing:-0.02em]"
  >
    Questions fréquentes
  </h2>
  <div
    class="[background:var(--client-surface)] [border:1px_solid_#E4E7E6] [border-radius:16px] [overflow:hidden]"
  >
    <div class="[border-bottom:1px_solid_#EEF0EF]">
      <button
        type="button"
        aria-expanded="true"
        class="[width:100%] [display:flex] [align-items:center] [justify-content:space-between] [gap:16px] [padding:20px_24px] [border:0] [background:transparent] [font-size:16px] [font-weight:500] [color:var(--client-text)] [text-align:left] [cursor:pointer] client-faq"
      >
        L'inscription est-elle gratuite ?<svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#4A5652"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="[transform:rotate(180deg)] [transition:transform_200ms_ease] [flex-shrink:0]"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg>
      </button>
      <p
        class="[margin:0] [padding:0_24px_20px] [font-size:15px] [line-height:1.6] [color:var(--client-text-tertiary)]"
      >
        Oui. L'inscription et la fiche boutique sont gratuites. Des options de
        mise en avant existent ; nous vous les présentons si vous le souhaitez.
      </p>
    </div>
    <div class="[border-bottom:1px_solid_#EEF0EF]">
      <button
        type="button"
        aria-expanded="false"
        class="[width:100%] [display:flex] [align-items:center] [justify-content:space-between] [gap:16px] [padding:20px_24px] [border:0] [background:transparent] [font-size:16px] [font-weight:500] [color:var(--client-text)] [text-align:left] [cursor:pointer] client-faq"
      >
        Qui met à jour mes prix ?<svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#4A5652"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="[transform:none] [transition:transform_200ms_ease] [flex-shrink:0]"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg>
      </button>
    </div>
    <div class="[border-bottom:1px_solid_#EEF0EF]">
      <button
        type="button"
        aria-expanded="false"
        class="[width:100%] [display:flex] [align-items:center] [justify-content:space-between] [gap:16px] [padding:20px_24px] [border:0] [background:transparent] [font-size:16px] [font-weight:500] [color:var(--client-text)] [text-align:left] [cursor:pointer] client-faq"
      >
        Je n'ai pas de site internet. Puis-je m'inscrire ?<svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#4A5652"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="[transform:none] [transition:transform_200ms_ease] [flex-shrink:0]"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg>
      </button>
    </div>
    <div class="[border-bottom:1px_solid_#EEF0EF]">
      <button
        type="button"
        aria-expanded="false"
        class="[width:100%] [display:flex] [align-items:center] [justify-content:space-between] [gap:16px] [padding:20px_24px] [border:0] [background:transparent] [font-size:16px] [font-weight:500] [color:var(--client-text)] [text-align:left] [cursor:pointer] client-faq"
      >
        Puis-je retirer ma boutique de Talaprix ?<svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#4A5652"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="[transform:none] [transition:transform_200ms_ease] [flex-shrink:0]"
          tpxVisual
          symbol="icon-f1ea3f8677ee"
        ></svg>
      </button>
    </div>
  </div>
</section>
