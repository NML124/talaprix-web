<article class="rounded-[22px] border border-slate-200 bg-white p-5">
  <div class="flex items-start justify-between">
    <span
      class="grid h-12 w-12 place-items-center rounded-2xl bg-[#e8f8f3] text-[#008b77]"
      ><svg lucideStore size="24"></svg></span
    ><span
      class="rounded-full px-3 py-1 text-xs font-bold"
      [class]="shop().isOpen ? 'bg-[#e8f8f3] text-[#008b77]' : 'bg-slate-100 text-slate-500'"
      >{{ shop().isOpen ? 'Ouvert' : 'Fermé' }}</span
    >
  </div>
  <h3 class="mt-5 text-lg font-black text-slate-900">{{ shop().name }}</h3>
  <p class="mt-1 text-sm text-slate-500">{{ shop().category }}</p>
  <div
    class="mt-5 space-y-2 border-t border-slate-100 pt-4 text-sm text-slate-600"
  >
    <p class="flex items-center gap-2">
      <svg lucideMapPin size="16" class="text-[#008b77]"></svg>{{ shop().area }}
      · {{ shop().distanceKm }} km
    </p>
    <p class="flex items-center gap-2">
      <svg lucideStar size="16" class="fill-amber-400 text-amber-400"></svg>{{
      shop().rating }} · {{ shop().productCount }} produits
    </p>
  </div>
</article>
