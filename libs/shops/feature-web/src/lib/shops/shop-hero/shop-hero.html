<section
  class="overflow-hidden rounded-[28px] bg-[#132b29] px-6 py-12 text-white sm:px-10"
>
  <p class="text-sm font-bold uppercase tracking-[.18em] text-[#7ce4d2]">
    Boutiques partenaires
  </p>
  <h1 class="mt-3 text-4xl font-black tracking-tight sm:text-5xl">
    Comparez les offres près de chez vous
  </h1>
  <p class="mt-3 max-w-2xl text-white/75">
    Retrouvez les boutiques qui participent à TalaPrix et accédez à leurs
    produits.
  </p>
  <label
    class="mt-7 flex max-w-xl items-center gap-3 rounded-2xl bg-white px-4 py-3 text-slate-800"
    for="shop-search"
    ><svg lucideSearch size="20" class="text-[#008b77]"></svg
    ><input
      id="shop-search"
      class="w-full border-0 p-0 text-sm outline-none"
      placeholder="Rechercher une boutique"
      (input)="updateQuery($event)"
  /></label>
</section>
