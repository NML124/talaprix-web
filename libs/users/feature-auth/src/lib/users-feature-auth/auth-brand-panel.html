<aside class="auth-brand-panel" aria-labelledby="auth-brand-title">
  <div class="auth-brand-content">
    <div class="auth-brand-masthead">
      <div class="auth-brand-wordmark">
        <img [src]="logoPath()" alt="" class="auth-brand-wordmark-logo" />
      </div>
      <span class="auth-brand-name">TalaPrix</span>
    </div>

    <header class="auth-brand-copy">
      <h2 id="auth-brand-title">Les bons prix, au bon endroit.</h2>
      <p>
        Comparez les offres des boutiques de Kinshasa et choisissez en
        confiance.
      </p>
    </header>

    <div class="auth-brand-scene" aria-hidden="true">
      <div class="auth-brand-radial-glow"></div>
      <div class="auth-brand-ring auth-brand-ring-inner"></div>
      <div class="auth-brand-ring auth-brand-ring-middle"></div>
      <div class="auth-brand-ring auth-brand-ring-outer"></div>

      <svg
        class="auth-brand-connectors"
        viewBox="0 0 1000 600"
        preserveAspectRatio="none"
      >
        <path d="M140 130 C300 170 420 240 580 312" />
        <path d="M880 130 C720 170 620 240 580 312" />
        <path d="M140 490 C300 425 420 365 580 312" />
        <path d="M880 490 C720 425 620 365 580 312" />
      </svg>

      <div class="auth-brand-wave auth-brand-wave-one"></div>
      <div class="auth-brand-wave auth-brand-wave-two"></div>

      <div class="auth-brand-medallion">
        <img [src]="logoPath()" alt="" />
      </div>

      <div class="auth-brand-store auth-brand-store-northwest">
        <span class="auth-brand-initial">M</span>
        <span class="auth-brand-bars"><i></i><i></i></span>
      </div>
      <div class="auth-brand-store auth-brand-store-northeast">
        <span class="auth-brand-initial">S</span>
        <span class="auth-brand-bars"><i></i><i></i></span>
      </div>
      <div class="auth-brand-store auth-brand-store-southwest">
        <span class="auth-brand-initial">K</span>
        <span class="auth-brand-bars"><i></i><i></i></span>
      </div>
      <div class="auth-brand-store auth-brand-store-southeast">
        <span class="auth-brand-best">Meilleur prix</span>
        <span class="auth-brand-initial auth-brand-initial-best">D</span>
        <span class="auth-brand-bars"><i></i><i></i></span>
      </div>
    </div>

    <footer class="auth-brand-footnote">
      <span class="auth-brand-arrow" aria-hidden="true">→</span>
      <p>Un accès simple à votre espace TalaPrix.</p>
    </footer>
  </div>
</aside>
