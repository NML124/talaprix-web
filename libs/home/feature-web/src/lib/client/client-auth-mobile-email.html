<div
  role="dialog"
  aria-modal="true"
  aria-labelledby="m-auth-title"
  class="absolute inset-x-0 bottom-0 flex max-h-[92dvh] flex-col gap-5 overflow-y-auto rounded-t-[28px] bg-[var(--client-surface)] px-5 pt-2.5 pb-[calc(28px+env(safe-area-inset-bottom,0px))] shadow-[0_-8px_32px_-8px_rgba(4,22,19,0.22)]"
>
  <span
    aria-hidden="true"
    class="mx-auto block h-[5px] w-10 shrink-0 rounded-full bg-[#D5D9DC]"
  ></span>
  <button
    type="button"
    aria-label="Fermer"
    (click)="ui.closeOverlays()"
    class="absolute top-4 right-4 inline-flex size-10 items-center justify-center rounded-full border border-[var(--client-line)] bg-[var(--client-surface)] text-[var(--client-text-secondary)] transition hover:bg-[var(--client-tile)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--client-action)]"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      tpxVisual
      symbol="icon-6d5dc2706247"
    ></svg>
  </button>
  <span
    class="flex size-16 items-center justify-center rounded-[18px] bg-[var(--client-mint-panel)]"
    ><img
      src="/client-design/assets/logo-talaprix.png"
      alt="Talaprix"
      class="size-[46px] object-contain"
      tpxShopAvatar
  /></span>
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <span
        class="text-[12px] font-semibold tracking-[0.18em] text-[var(--client-action)]"
        >CONNEXION</span
      >
      <h1
        id="m-auth-title"
        class="m-0 text-[30px] leading-[1.08] font-semibold tracking-[-0.03em] text-[var(--client-text)]"
      >
        Bon retour
      </h1>
      <p class="m-0 text-[14.5px] leading-normal text-[var(--client-muted)]">
        Recevez un code par e-mail pour vous connecter. Favoris, alertes et
        panier vous suivent sur le site et l'app.
      </p>
    </div>
    @if (gate.reason()) {
    <p
      role="status"
      class="m-0 flex items-start gap-2.5 rounded-2xl bg-[var(--client-mint)] px-4 py-3 text-[14px] font-medium leading-snug text-[var(--client-action)] animate-fade-in motion-reduce:animate-none"
    >
      <svg
        class="mt-0.5 shrink-0"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
      {{ gate.reason() }}
    </p>
    }
    <form novalidate class="flex flex-col gap-4" (submit)="submit($event)">
      <div class="flex flex-col gap-2">
        <label
          for="m-email"
          class="text-[14px] font-semibold text-[var(--client-text)]"
          >Adresse e-mail</label
        >
        <div class="relative">
          <svg
            lucideMail
            size="18"
            aria-hidden="true"
            class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2"
            [class]="
              auth.emailInvalid()
                ? 'text-[var(--client-error)]'
                : 'text-[var(--client-subtle)]'
            "
          ></svg>
          <input
            #emailInput
            id="m-email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="off"
            spellcheck="false"
            placeholder="vous@email.com"
            aria-describedby="m-email-error"
            [attr.aria-invalid]="auth.emailInvalid()"
            [value]="auth.email()"
            [readOnly]="auth.pending()"
            (input)="auth.setEmail($event)"
            (blur)="auth.checkEmail()"
            class="h-12 w-full rounded-[14px] border bg-white pr-10 pl-11 text-[16px] text-[var(--client-text)] outline-none transition placeholder:text-[var(--client-subtle)] focus:ring-4"
            [class]="
              auth.emailInvalid()
                ? 'border-[var(--client-error)] focus:border-[var(--client-error)] focus:ring-[var(--client-error)]/15'
                : 'border-[var(--client-border)] focus:border-[var(--client-action)] focus:ring-[var(--client-action)]/15'
            "
          />
          @if (auth.email() && !auth.pending()) {
          <button
            type="button"
            aria-label="Effacer l'adresse e-mail"
            (mousedown)="$event.preventDefault()"
            (click)="clear()"
            class="absolute top-1/2 right-2 inline-flex size-7 -translate-y-1/2 items-center justify-center rounded-full text-[var(--client-subtle)] transition hover:bg-[var(--client-tile)] hover:text-[var(--client-text)] focus-visible:outline-2 focus-visible:outline-[var(--client-action)]"
          >
            <svg lucideX size="16" aria-hidden="true"></svg>
          </button>
          }
        </div>
        <p
          id="m-email-error"
          role="alert"
          class="m-0 flex min-h-5 items-start gap-1.5 text-[13px] text-[var(--client-error)]"
        >
          @if (auth.error()) {
          <svg
            lucideCircleAlert
            size="16"
            aria-hidden="true"
            class="mt-px shrink-0"
          ></svg
          >{{ auth.error() }} }
        </p>
      </div>
      <button
        type="submit"
        [disabled]="auth.pending()"
        [attr.aria-busy]="auth.pending()"
        class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-[15px] bg-[var(--client-action)] px-5 text-[15px] font-semibold text-white transition duration-150 hover:bg-[var(--client-action-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--client-action)] active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
      >
        @if (auth.pending()) {
        <svg
          lucideLoaderCircle
          size="18"
          aria-hidden="true"
          class="animate-spin motion-reduce:animate-none"
        ></svg
        >Envoi du code… } @else { Recevoir le code }
      </button>
    </form>
    <div
      class="flex items-center gap-4 text-[12px] tracking-[0.12em] text-[var(--client-subtle)]"
    >
      <span class="h-px flex-1 bg-[var(--client-line)]"></span>OU<span
        class="h-px flex-1 bg-[var(--client-line)]"
      ></span>
    </div>
    <button
      type="button"
      [disabled]="auth.pending()"
      (click)="auth.signInWithGoogle()"
      class="inline-flex h-12 w-full items-center justify-center gap-3 rounded-[15px] border border-[var(--client-line)] bg-[var(--client-surface)] px-5 text-[14.5px] font-semibold text-[var(--client-text)] transition duration-150 hover:bg-[var(--client-tile)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--client-action)] active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
    >
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
        ></path>
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
        ></path>
        <path
          fill="#4CAF50"
          d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"
        ></path>
        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
        ></path>
      </svg>
      Continuer avec Google
    </button>
  </div>
</div>
