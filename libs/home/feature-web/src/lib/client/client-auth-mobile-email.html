<div
  role="dialog"
  aria-modal="true"
  aria-labelledby="m-auth-title"
  class="[position:absolute] [left:0] [right:0] [bottom:0] [background:var(--client-surface)] [border-radius:28px_28px_0_0] [padding:10px_20px_34px] [display:flex] [flex-direction:column] [gap:18px] [box-shadow:0_-12px_40px_rgba(4,22,19,0.25)]"
>
  <span
    aria-hidden="true"
    class="[display:block] [width:40px] [height:5px] [border-radius:3px] [background:#D5D9DC] [margin:0_auto]"
  ></span>
  <button
    type="button"
    aria-label="Fermer"
    (click)="ui.closeOverlays()"
    role="button"
    tabindex="0"
    (keydown.enter)="ui.closeOverlays()"
    class="[position:absolute] [top:18px] [right:18px] [width:40px] [height:40px] [border-radius:20px] [border:1px_solid_#DCE5E2] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-text-secondary)] [box-sizing:border-box]"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      tpxVisual
      symbol="icon-6d5dc2706247"
    ></svg>
  </button>
  <span
    class="[width:64px] [height:64px] [border-radius:18px] [background:var(--client-mint-panel)] [display:flex] [align-items:center] [justify-content:center]"
    ><img
      src="/client-design/assets/logo-talaprix.png"
      alt="Talaprix"
      class="[width:46px] [height:46px] [object-fit:contain]"
      tpxShopAvatar
  /></span>
  <div class="[display:flex] [flex-direction:column] [gap:18px]">
    <div class="[display:flex] [flex-direction:column] [gap:6px]">
      <span
        class="[font-size:12px] [font-weight:600] [letter-spacing:0.18em] [color:var(--client-action)]"
        >CONNEXION</span
      >
      <h1
        id="m-auth-title"
        class="[margin:0] [font-size:30px] [line-height:1.08] [font-weight:600] [letter-spacing:-0.03em]"
      >
        Bon retour
      </h1>
      <p
        class="[margin:0] [font-size:14.5px] [line-height:1.5] [color:var(--client-muted)]"
      >
        Recevez un code par e-mail pour vous connecter. Favoris, alertes et
        panier vous suivent sur le site et l'app.
      </p>
    </div>
    <div class="[display:flex] [flex-direction:column] [gap:8px]">
      <label for="m-email" class="[font-size:14px] [font-weight:600]"
        >Adresse e-mail</label
      ><input
        id="m-email"
        type="email"
        autocomplete="email"
        placeholder="vous@email.com"
        [value]="auth.email()"
        (input)="auth.setEmail($event)"
        (keydown.enter)="auth.requestCode()"
        class="[height:54px] [padding:0_16px] [border:1px_solid_#D6E3DF] [border-radius:20px] [font:inherit] [font-size:16px] [color:var(--client-text)] [box-sizing:border-box] [width:100%]"
      />
    </div>
    <button
      type="button"
      (click)="auth.requestCode()"
      class="[height:54px] [border:0] [border-radius:20px] [background:var(--client-action)] [color:var(--client-surface)] [font:inherit] [font-size:16px] [font-weight:600] [cursor:pointer] [display:flex] [align-items:center] [justify-content:center] [text-decoration:none] [width:100%]"
    >
      Recevoir le code
    </button>
    <div
      class="[display:flex] [align-items:center] [gap:14px] [color:var(--client-subtle)] [font-size:12px] [letter-spacing:0.12em]"
    >
      <span class="[flex:1] [height:1px] [background:#E6ECEA]"></span>OU<span
        class="[flex:1] [height:1px] [background:#E6ECEA]"
      ></span>
    </div>
    <a
      routerLink="/compte"
      (click)="ui.signedIn.set(true); ui.authOpen.set(false)"
      class="[height:54px] [display:flex] [align-items:center] [justify-content:center] [gap:12px] [border:1px_solid_#DCE5E2] [border-radius:20px] [background:var(--client-surface)] [font-size:15.5px] [font-weight:500] [color:var(--client-text)] [text-decoration:none] [box-sizing:border-box]"
      ><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
        ></path>
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
        ></path>
        <path
          fill="#4CAF50"
          d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"
        ></path>
        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
        ></path></svg
      >Continuer avec Google</a
    >
  </div>
</div>
