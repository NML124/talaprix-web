<section
  aria-labelledby="shops-t"
  class="[background:var(--client-surface)] [border-radius:14px] [padding:24px_20px_20px]"
>
  <div
    class="[display:flex] [align-items:baseline] [justify-content:space-between] [gap:16px] [margin-bottom:16px] [padding:0_6px]"
  >
    <div
      class="[display:flex] [align-items:baseline] [gap:14px] [flex-wrap:wrap]"
    >
      <h2
        id="shops-t"
        class="[margin:0] [font-size:22px] [font-weight:600] [letter-spacing:-0.02em]"
      >
        Boutiques près de vous
      </h2>
      <a
        routerLink="/boutiques"
        [queryParams]="{position:'refusee'}"
        routerLink="/boutiques"
        class="[font-size:13.5px] [color:var(--client-distance)] [text-decoration:none] [display:inline-flex] [align-items:center] [gap:5px]"
        ><svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-fda2071e8d4e"
        ></svg
        >Utiliser ma position pour voir les distances</a
      >
    </div>
    <a
      routerLink="/boutiques"
      class="[font-size:14px] [font-weight:600] [text-decoration:none] [white-space:nowrap]"
      >Voir la carte<span class="inline-flex align-middle"
        ><svg
          tpxVisual
          symbol="client-chevron-right"
          class="client-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        ></svg></span
    ></a>
  </div>
  <div
    class="[display:grid] [grid-template-columns:repeat(5,_minmax(0,_1fr))] [gap:12px] client-g6"
  >
    <a
      class="[display:flex] [flex-direction:column] [align-items:center] [text-align:center] [gap:10px] [padding:20px_14px_18px] [border-radius:14px] [background:#F7F8F9] [text-decoration:none] [color:var(--client-text)] client-shop"
      routerLink="/boutiques"
    >
      <span
        class="[width:64px] [height:64px] [border-radius:50%] [background:var(--client-surface)] [border:1px_solid_#E1E8E6] [overflow:hidden] [display:flex] [align-items:center] [justify-content:center]"
        ><img
          src="/client-design/assets/logo-talaprix.png"
          alt=""
          class="[width:70%] [height:70%] [object-fit:contain]"
          tpxShopAvatar
      /></span>
      <span
        class="[display:flex] [flex-direction:column] [gap:3px] [min-width:0] [width:100%]"
        ><span
          class="[font-size:14.5px] [font-weight:600] [white-space:nowrap] [overflow:hidden] [text-overflow:ellipsis]"
          >UAC – Gombe</span
        ><span class="[font-size:12.5px] [color:var(--client-muted)]"
