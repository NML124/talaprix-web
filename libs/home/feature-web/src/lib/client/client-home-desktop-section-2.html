          class="client-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        ></svg></span

  </div>

        aria-label="Apple AirPods Pro (2e génération)"
        routerLink="/produit/samsung-galaxy-s24-128-go"
      >
        <svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:152px] [height:152px]"
          tpxVisual
          symbol="i-buds"
        ></svg>
      </a>
      <button
        type="button"
        aria-label="Ajouter aux favoris"
        (click)="catalog.toggleFavorite('Apple AirPods Pro (2e génération)')"
        [attr.aria-pressed]="catalog.favorite('Apple AirPods Pro (2e génération)')"
        [style.color]="catalog.favorite('Apple AirPods Pro (2e génération)') ? '#007A6C' : '#2E3B37'"
        class="[position:absolute] [top:14px] [right:14px] [width:32px] [height:32px] [border-radius:16px] [border:0] [background:var(--client-surface)] [box-shadow:0_1px_3px_rgba(15,26,23,0.12)] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-text-secondary)] [cursor:pointer]"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          [attr.fill]="catalog.favorite('Apple AirPods Pro (2e génération)') ? '#E3F2EF' : 'none'"
          tpxVisual
          symbol="icon-d6d8d482ea7e"
        ></svg>
      </button>
      <a
        class="[padding:0_2px] [font-size:13.5px] [line-height:1.4] [font-weight:500] [color:var(--client-text)] [text-decoration:none] [height:38px] [overflow:hidden] client-ptitle client-product-title"

      <span
        class="[padding:0_2px] [font-size:18px] [font-weight:700] [letter-spacing:-0.01em] [font-variant-numeric:tabular-nums]"
        tpxPriceTag

      <span
        class="[padding:0_2px] [display:flex] [align-items:center] [gap:7px] [font-size:12px] [color:var(--client-text-tertiary)]"

          src="/client-design/assets/logo-talaprix.png"
