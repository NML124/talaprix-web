<div
  class="[position:relative] [overflow:hidden] [background:linear-gradient(165deg,_var(--client-mint-panel)_0%,_#F5FBFA_70%)] [padding:64px_52px] [display:flex] [flex-direction:column] [gap:22px] client-auth-left"
>
  <span
    aria-hidden="true"
    class="[position:absolute] [top:36px] [right:-40px] [width:210px] [height:210px] [border-radius:50%] [border:1px_solid_#CFE7E1]"
  ></span>
  <span
    aria-hidden="true"
    class="[position:absolute] [top:86px] [right:10px] [width:110px] [height:110px] [border-radius:50%] [border:1px_solid_#DCEEE9]"
  ></span>
  <span
    class="[position:relative] [width:116px] [height:116px] [border-radius:30px] [background:var(--client-surface)] [display:flex] [align-items:center] [justify-content:center] [border:1px_solid_#DCEEE9]"
    ><img
      src="/client-design/assets/logo-talaprix.png"
      alt="Talaprix"
      class="[width:84px] [height:84px] [object-fit:contain]"
      tpxShopAvatar
  /></span>
  <h2
    class="[position:relative] [margin:10px_0_0] [font-size:29px] [line-height:1.2] [font-weight:600] [letter-spacing:-0.02em] [color:var(--client-text)]"
  >
    Accédez à votre espace Talaprix
  </h2>
  <p
    class="[position:relative] [margin:0] [font-size:15.5px] [line-height:1.75] [color:var(--client-text-tertiary)] [max-width:380px]"
  >
    Connectez-vous pour retrouver vos favoris, suivre les prix et préparer vos
    achats plus vite.
  </p>
  <div
    class="[position:relative] [margin-top:18px] [background:rgba(255,255,255,0.88)] [border-radius:22px] [padding:22px_24px] [display:flex] [flex-direction:column] [gap:16px]"
  >
    <div
      class="[display:flex] [align-items:center] [justify-content:space-between] [gap:12px] [padding-bottom:16px] [border-bottom:1px_solid_#E3EFEC]"
    >
      <span class="[display:flex] [flex-direction:column] [gap:3px]"
        ><span
          class="[font-size:15px] [font-weight:600] [color:var(--client-text)]"
          >Votre espace personnel</span
        ><span class="[font-size:13px] [color:var(--client-muted)]"
          >Simple, rapide et sécurisé.</span
        ></span
      >
      <span
        class="[width:44px] [height:44px] [border-radius:22px] [background:var(--client-mint)] [color:var(--client-action)] [display:flex] [align-items:center] [justify-content:center]"
        ><svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-d6d8d482ea7e"
        ></svg
      ></span>
    </div>
    <span
      class="[display:flex] [align-items:center] [gap:16px] [font-size:14.5px] [color:var(--client-text-secondary)]"
      ><svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#007A6C"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-d6d8d482ea7e"
      ></svg
      >Gardez vos produits favoris.</span
    >
    <span
      class="[display:flex] [align-items:center] [gap:16px] [font-size:14.5px] [color:var(--client-text-secondary)]"
      ><svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#007A6C"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-ffb775ad146b"
      ></svg
      >Soyez prévenu quand un prix baisse.</span
    >
    <span
      class="[display:flex] [align-items:center] [gap:16px] [font-size:14.5px] [color:var(--client-text-secondary)]"
      ><svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#007A6C"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-1670e5a4781a"
      ></svg
      >Retrouvez votre panier sur le site et l'app.</span
    >
  </div>
</div>
