<div
  class="[background:var(--client-surface)] [border-radius:14px] [padding:20px_18px_18px] [display:flex] [flex-direction:column] [gap:14px]"
>
  <h2 class="m-0 text-[18px] font-semibold tracking-[-.015em]">
    <a
      routerLink="/resultats"
      class="flex items-center justify-between gap-3 text-inherit"
      aria-label="Voir la catégorie Téléphones"
      ><span>Téléphones</span
      ><svg
        class="client-chevron"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m9 5 7 7-7 7" /></svg
    ></a>
  </h2>
  <div
    class="[display:grid] [grid-template-columns:repeat(2,_minmax(0,_1fr))] [gap:10px]"
  >
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [gap:6px] [text-decoration:none] [color:var(--client-text-secondary)]"
    >
      <span
        class="[height:104px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] client-mos"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:92px] [height:92px]"
          tpxVisual
          symbol="i-phone"
        ></svg
      ></span>
      <span class="[font-size:12.5px]">Samsung</span>
    </a>
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [gap:6px] [text-decoration:none] [color:var(--client-text-secondary)]"
    >
      <span
        class="[height:104px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] client-mos"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:92px] [height:92px]"
          tpxVisual
          symbol="i-phone-pink"
        ></svg
      ></span>
      <span class="[font-size:12.5px] client-product-title" title="iPhone"
        >iPhone</span
      >
    </a>
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [gap:6px] [text-decoration:none] [color:var(--client-text-secondary)]"
    >
      <span
        class="[height:104px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] client-mos"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:92px] [height:92px]"
          tpxVisual
          symbol="i-phone-orange"
        ></svg
      ></span>
      <span class="[font-size:12.5px]">Tecno</span>
    </a>
    <a
      routerLink="/resultats"
      class="[display:flex] [flex-direction:column] [gap:6px] [text-decoration:none] [color:var(--client-text-secondary)]"
    >
      <span
        class="[height:104px] [border-radius:10px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center] client-mos"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:92px] [height:92px]"
          tpxVisual
          symbol="i-powerbank"
        ></svg
      ></span>
      <span class="[font-size:12.5px]">Batteries externes</span>
    </a>
  </div>
</div>
