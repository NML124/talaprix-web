<section
  aria-labelledby="m-drop"
  class="[margin-top:12px] [background:var(--client-surface)] [padding:16px_14px_14px]"
>
  <div
    class="[display:flex] [align-items:baseline] [justify-content:space-between] [padding-bottom:10px]"
  >
    <h2
      id="m-drop"
      class="[margin:0] [font-size:19px] [font-weight:500] [letter-spacing:-0.025em]"
    >
      Prix en baisse
    </h2>
    <a
      routerLink="/resultats"
      class="[font-size:13.5px] [font-weight:500] [text-decoration:none]"
      >Tout voir<span class="inline-flex align-middle"
        ><svg
          tpxVisual
          symbol="client-chevron-right"
          class="client-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        ></svg></span
    ></a>
  </div>
  <div
    class="[display:grid] [grid-template-columns:repeat(2,_minmax(0,_1fr))] [gap:14px_10px]"
  >
    <a
      routerLink="/produit/samsung-galaxy-s24-128-go"
      class="[display:flex] [flex-direction:column] [gap:6px] [text-decoration:none] [color:var(--client-text)]"
    >
      <span
        class="[position:relative] [height:160px] [border-radius:12px] [background:var(--client-tile)] [display:flex] [align-items:center] [justify-content:center]"
        ><svg
          viewBox="0 0 200 200"
          aria-hidden="true"
          class="[width:132px] [height:132px]"
          tpxVisual
          symbol="i-phone-pink"
        ></svg
        ><span
          class="[position:absolute] [top:8px] [left:8px] [height:22px] [padding:0_7px] [border-radius:6px] [background:var(--client-action)] [color:var(--client-surface)] [font-size:11.5px] [font-weight:600] [display:flex] [align-items:center]"
          >−6 %</span
        ></span
      >
      <span
        class="[font-size:13px] [line-height:1.3] [height:34px] [overflow:hidden] client-product-title"
        title="iPhone 15 128 Go"
        >iPhone 15 128 Go</span
      >
      <span class="[display:flex] [align-items:baseline] [gap:6px]"
        ><span
          class="[font-size:17px] [font-weight:600] [letter-spacing:-0.02em] [font-variant-numeric:tabular-nums]"
          tpxPriceTag
          [value]="ui.money(735)"

        ><span
          class="[font-size:12px] [color:var(--client-muted)] [text-decoration:line-through]"
