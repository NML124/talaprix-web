<header class="[background:var(--client-action)]">
  <div
    class="[max-width:1320px] [margin:0_auto] [padding:0_24px] [box-sizing:border-box] [height:68px] [display:flex] [align-items:center] [gap:16px] [color:var(--client-surface)] client-hdr"
  >
    <a
      aria-label="Talaprix, accueil"
      class="[display:flex] [align-items:center] [gap:10px] [text-decoration:none] [color:var(--client-surface)] [padding:6px_8px_6px_4px] [border-radius:8px] [flex-shrink:0] client-hd"
      routerLink="/"
    >
      <span
        class="[width:40px] [height:40px] [border-radius:11px] [background:var(--client-surface)] [display:flex] [align-items:center] [justify-content:center]"
        ><img
          src="/client-design/assets/logo-talaprix.png"
          alt=""
          class="[width:32px] [height:32px] [object-fit:contain]"
          tpxShopAvatar
      /></span>
      <span class="[font-size:22px] [font-weight:700] [letter-spacing:-0.02em]"
        >Talaprix</span
      >
    </a>
    <a
      class="[display:flex] [align-items:center] [gap:6px] [padding:6px_8px] [border-radius:8px] [color:var(--client-surface)] [text-decoration:none] [flex-shrink:0] client-hd client-hide-md"
      routerLink="/boutiques"
      [queryParams]="{position:'refusee'}"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-2e30b98a0d8c"
      ></svg>
      <span class="[display:flex] [flex-direction:column] [line-height:1.2]"
        ><span class="[font-size:12px] [opacity:0.85]">Autour de</span
        ><span class="[font-size:14px] [font-weight:600]"
          >Me localiser</span
        ></span
      >
    </a>
    <div class="relative min-w-0 flex-1">
      <form
        role="search"
        class="w-full [flex:1_1_auto] [display:flex] [height:44px] [border-radius:10px] [background:var(--client-surface)] [overflow:visible] [margin:0] client-hdr-search"
        (submit)="$event.preventDefault()"
      >
        <label
          for="hdr-scope"
          class="[position:absolute] [width:1px] [height:1px] [overflow:hidden] [clip:rect(0_0_0_0)]"
          >Catégorie</label
        >
        <tpx-select-card
          label="Catégorie"
          [options]='[{"label":"Toutes catégories","value":"Toutes catégories"},{"label":"Téléphones","value":"Téléphones"},{"label":"Ordinateurs","value":"Ordinateurs"},{"label":"Énergie solaire","value":"Énergie solaire"}]'
          [compact]="true"
          class="client-search-category"
        />
        <label
          for="hdr-q"
          class="[position:absolute] [width:1px] [height:1px] [overflow:hidden] [clip:rect(0_0_0_0)]"
          >Rechercher</label
        >
        <input
          id="hdr-q"
          type="search"
          placeholder="Rechercher un produit, une marque ou une boutique"
          [value]="ui.query()"
          (input)="ui.setQuery($event)"
          (keydown.enter)="ui.search()"
          (focus)="ui.openSearch()"
          (keydown.arrowdown)="focusSuggestion($event)"
          class="[flex:1] [min-width:0] [border:0] [outline:none] [padding:0_14px] [font:inherit] [font-size:13px] [color:var(--client-text)]"
        />
        <button
          type="button"
          aria-label="Lancer la recherche"
          class="[width:56px] [display:flex] [align-items:center] [justify-content:center] [background:var(--client-dark)] [color:var(--client-surface)]"
          (click)="ui.search()"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            tpxVisual
            symbol="icon-74dcdc4769ed"
          ></svg>
        </button>
      </form>
      @if (ui.searchOpen()) { <lib-client-search-suggestions /> }
    </div>

    <a
      class="[width:44px] [height:44px] [border-radius:8px] [display:flex] [align-items:center] [justify-content:center] [color:var(--client-surface)] [flex-shrink:0] client-hd"
      aria-label="Favoris"
      routerLink="/compte"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        tpxVisual
        symbol="icon-d6d8d482ea7e"
      ></svg>
    </a>
    <a
      class="[display:flex] [align-items:center] [gap:8px] [padding:6px_10px_6px_8px] [border-radius:8px] [color:var(--client-surface)] [text-decoration:none] [flex-shrink:0] [box-shadow:none] client-hd"
      aria-label="Panier, 3 produits"
      routerLink="/panier"
    >
      <span class="relative flex"
        ><svg
          tpxVisual
          symbol="icon-1670e5a4781a"
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        ></svg
        ><span
          class="absolute -right-1 -top-1 grid size-4 place-items-center rounded-full bg-white text-[10px] font-bold text-[#007A6C]"
          >{{ ui.cartCount() }}</span
        ></span
      >
      <span class="[font-size:14px] [font-weight:600] client-hide-md"
        >Panier</span
      > </a
    ><button
      type="button"
      (click)="ui.authenticate()"
      class="client-header-login shrink-0"
      aria-label="Se connecter"
    >
      <svg
        class="size-[22px]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" /></svg
      ><span>Se connecter</span>
    </button>
  </div>
  <nav
    class="[background:var(--client-navigation)] client-nav-row"
    aria-label="Catégories"
  >
    <div
      class="[max-width:1320px] [margin:0_auto] [padding:0_16px] [box-sizing:border-box] [height:42px] [display:flex] [align-items:center] [gap:2px] [color:var(--client-surface)] [font-size:14px] [white-space:nowrap] [overflow:hidden]"
    >
      <a
        class="[display:flex] [align-items:center] [gap:8px] [height:32px] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] [font-weight:600] client-nav"
        routerLink="/categories"
        ><svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-c67fc5c5da6b"
        ></svg
        >Toutes les catégories</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Téléphones</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Ordinateurs</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >TV et audio</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Énergie solaire</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Imprimantes</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Accessoires</a
      >
      <a
        class="[height:32px] [display:flex] [align-items:center] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] client-nav"
        routerLink="/resultats"
        >Maison</a
      >
      <span class="[margin-left:auto]"></span>
      <a
        class="[display:flex] [align-items:center] [gap:6px] [height:32px] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] [font-weight:600] client-nav"
        routerLink="/resultats"
        ><svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-2d7001defd0e"
        ></svg
        >Prix en baisse</a
      >
      <a
        class="[display:flex] [align-items:center] [gap:6px] [height:32px] [padding:0_10px] [border-radius:6px] [color:var(--client-surface)] [text-decoration:none] [font-weight:600] client-nav"
        routerLink="/boutiques"
        ><svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          tpxVisual
          symbol="icon-3513dee1999b"
        ></svg
        >Boutiques près de moi</a
      >
    </div>
  </nav>
</header>
