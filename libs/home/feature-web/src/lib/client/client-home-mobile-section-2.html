<section aria-label="À la une" class="[padding:16px_12px_6px]">
  <div
    class="[position:relative] [height:250px] [border-radius:18px] [overflow:hidden] [background-color:#1A1D1C] client-banner-mobile client-banner-photo"
  >
    <span
      aria-hidden="true"
      class="[position:absolute] [inset:0] [background:linear-gradient(180deg,_rgba(0,0,0,0.25)_0%,_rgba(0,0,0,0.45)_45%,_rgba(0,0,0,0.82)_100%)]"
    ></span>
    <div
      class="[position:absolute] [left:0] [right:0] [bottom:0] [box-sizing:border-box] [padding:20px] [display:flex] [flex-direction:column] [gap:8px] [color:var(--client-surface)]"
    >
      <span class="[font-size:12px] [opacity:0.85]"
        >Les prix des boutiques de Kinshasa</span
      >
      <h1
        class="[margin:0] [font-size:30px] [line-height:1.04] [font-weight:500] [letter-spacing:-0.035em]"
      >
        Le bon produit, au bon prix.
      </h1>
      <div class="[display:flex] [gap:8px] [margin-top:6px]">
        <a
          routerLink="/resultats"
          class="[display:inline-flex] [align-items:center] [height:40px] [padding:0_16px] [border-radius:14px] [background:var(--client-surface)] [color:var(--client-text)] [font-size:13.5px] [font-weight:500] [text-decoration:none]"
          >Voir les offres</a
        >
        <a
          routerLink="/boutiques"
          class="[display:inline-flex] [align-items:center] [height:40px] [padding:0_14px] [border-radius:14px] [border:1px_solid_rgba(255,255,255,0.5)] [color:var(--client-surface)] [font-size:13.5px] [text-decoration:none]"
          >Près de moi</a
        >
      </div>
    </div>
  </div>
</section>
