<div class="relative" [class.w-full]="variant() === 'drawer'">
  <button
    #trigger
    type="button"
    class="focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
    [class.flex]="variant() === 'desktop'"
    [class.shrink-0]="variant() === 'desktop'"
    [class.items-center]="variant() === 'desktop'"
    [class.gap-2.5]="variant() === 'desktop'"
    [class.rounded-xl]="variant() === 'desktop'"
    [class.px-2]="variant() === 'desktop'"
    [class.py-1.5]="variant() === 'desktop'"
    [class.text-[13px]]="variant() === 'desktop'"
    [class.font-bold]="variant() === 'desktop'"
    [class.text-[#202523]]="variant() === 'desktop'"
    [class.transition-colors]="variant() === 'desktop'"
    [class.hover:text-[#151515]]="variant() === 'desktop'"
    [class.flex]="variant() === 'drawer'"
    [class.w-full]="variant() === 'drawer'"
    [class.items-center]="variant() === 'drawer'"
    [class.justify-center]="variant() === 'drawer'"
    [class.gap-2.5]="variant() === 'drawer'"
    [class.rounded-xl]="variant() === 'drawer'"
    [class.bg-[#009f88]]="variant() === 'drawer'"
    [class.py-3.5]="variant() === 'drawer'"
    [class.text-[13px]]="variant() === 'drawer'"
    [class.font-bold]="variant() === 'drawer'"
    [class.text-white]="variant() === 'drawer'"
    [class.shadow-sm]="variant() === 'drawer'"
    (click)="toggleDownload()"
    aria-haspopup="dialog"
    [attr.aria-controls]="'download-app-panel-' + variant()"
    [attr.aria-expanded]="isDownloadOpen()"
  >
    @if (variant() === 'desktop') {
    <svg lucideQrCode size="24" aria-hidden="true"></svg>
    <span class="whitespace-nowrap">Télécharger l'application</span>
    } @else {
    <svg lucideDownload size="20" aria-hidden="true"></svg>
    <span>Télécharger l'application</span>
    }
  </button>

  @if (isDownloadOpen()) {
  <section
    [id]="'download-app-panel-' + variant()"
    class="absolute z-[60] overflow-hidden rounded-[28px] border border-[#dce5e2] bg-white text-[#1f2d2a] shadow-[0_8px_20px_rgba(13,32,28,0.08)] [font-family:'Lato',sans-serif]"
    [class.right-0]="variant() === 'desktop'"
    [class.top-[calc(100%+12px)]]="variant() === 'desktop'"
    [class.w-[680px]]="variant() === 'desktop'"
    [class.bottom-[calc(100%+12px)]]="variant() === 'drawer'"
    [class.left-0]="variant() === 'drawer'"
    [class.w-full]="variant() === 'drawer'"
    role="dialog"
    aria-label="Télécharger l'application TalaPrix"
  >
    <header class="flex items-center justify-between px-5 pt-5">
      <p class="text-[13px] font-bold text-[#137c6e]">
        TalaPrix dans votre poche
      </p>
      <button
        type="button"
        class="flex h-7 w-7 items-center justify-center rounded-lg text-[#65716d] hover:bg-[#f0f4f2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
        aria-label="Fermer le téléchargement"
        (click)="closeAndRestoreFocus()"
      >
        <svg lucideX size="16"></svg>
      </button>
    </header>
    <div
      class="flex gap-4 px-5 pb-5 pt-4"
      [class.items-center]="variant() === 'desktop'"
      [class.flex-col]="variant() === 'drawer'"
    >
      <div
        class="flex h-[110px] w-[110px] shrink-0 items-center justify-center rounded-2xl border border-[#e1e9e6] bg-[#fbfdfc] p-2"
      >
        @if (qrCodeUrl(); as source) {
        <img
          [src]="source"
          alt="QR code pour télécharger l'application TalaPrix"
          class="h-full w-full"
        />
        } @else if (qrCodeError()) {
        <p class="px-2 text-center text-[10px] text-[#a34a42]">
          QR code indisponible.
        </p>
        } @else {
        <span class="h-10 w-10 animate-pulse rounded-lg bg-[#dfe9e5]"></span>
        }
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[18px] font-black tracking-[-0.02em] text-[#172522]">
          Comparez les prix partout.
        </p>
        <p class="mt-1 max-w-[250px] text-[13px] leading-5 text-[#5e6d68]">
          Retrouvez les meilleures offres de Kinshasa depuis votre téléphone.
        </p>
      </div>
      <div
        class="grid shrink-0 gap-2"
        [class.grid-cols-2]="variant() === 'drawer'"
        [class.w-full]="variant() === 'drawer'"
      >
        <a
          [href]="links.appStore"
          target="_blank"
          rel="noopener noreferrer"
          class="flex h-11 items-center justify-center gap-2 rounded-xl bg-black px-3 text-white transition hover:bg-[#1e1e1e] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88] focus-visible:ring-offset-2"
        >
          <img
            src="/assets/images/logo-apple.png"
            alt=""
            class="h-5 w-5 object-contain"
          />
          <span class="text-[11px] font-bold">App Store</span>
        </a>
        <a
          [href]="links.googlePlay"
          target="_blank"
          rel="noopener noreferrer"
          class="flex h-11 items-center justify-center gap-2 rounded-xl bg-black px-3 text-white transition hover:bg-[#1e1e1e] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88] focus-visible:ring-offset-2"
        >
          <img
            src="/assets/images/playstore.png"
            alt=""
            class="h-5 w-5 object-contain"
          />
          <span class="text-[11px] font-bold">Google Play</span>
        </a>
      </div>
    </div>
  </section>
  }
</div>
