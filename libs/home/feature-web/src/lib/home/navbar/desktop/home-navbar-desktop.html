<!-- Desktop Header -->
<div
  class="hidden h-[80px] items-center px-[clamp(72px,7vw,128px)] min-[1100px]:flex"
>
  <a
    routerLink="/"
    class="flex shrink-0 items-center gap-3.5"
    aria-label="TalaPrix, accueil"
  >
    <span
      class="flex h-[52px] w-[52px] items-center justify-center overflow-hidden"
    >
      <img
        src="/assets/images/logo_app.png"
        alt=""
        class="h-[52px] w-[52px] max-w-none scale-[1.65] object-contain"
      />
    </span>
    <span class="h-11 w-px bg-[#cfcfcf]" aria-hidden="true"></span>
    <span class="text-[22px] font-bold tracking-[-0.02em] text-[#202020]"
      >Talaprix</span
    >
  </a>

  <lib-home-navbar-search
    class="ml-[clamp(32px,4vw,68px)] mr-[clamp(18px,2vw,30px)] min-w-[270px] flex-1"
    variant="desktop"
  />

  <div class="flex shrink-0 items-center gap-[clamp(16px,1.65vw,28px)]">
    <lib-home-navbar-download variant="desktop" />

    <lib-home-navbar-locale />

    <button
      type="button"
      class="relative grid h-10 w-9 place-items-center rounded-lg text-[#191919] transition-colors hover:bg-[#f0f2f2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
      aria-label="Notifications"
      title="Notifications"
    >
      <svg lucideBell size="22" aria-hidden="true"></svg>
      <span
        class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-[#009f88]"
      ></span>
    </button>

    <a
      routerLink="/favorites"
      class="relative flex h-10 items-center justify-center gap-1.5 rounded-lg px-1 text-[#191919] transition-colors hover:bg-[#f0f2f2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
      aria-label="Mes favoris"
    >
      <svg lucideHeart size="23" aria-hidden="true"></svg>
      <span class="hidden text-[11px] font-bold min-[1350px]:inline"
        >Favoris</span
      >
      @if (favoriteCount()) {
      <span
        class="absolute right-[-3px] top-[-2px] rounded-full bg-[#009f88] px-[4px] text-[8px] font-bold text-white"
        >{{ favoriteCount() }}</span
      >
      }
    </a>

    <a
      routerLink="/cart"
      class="relative flex h-10 w-9 shrink-0 items-center justify-center rounded-lg text-[#191919] transition-colors hover:bg-[#f0f2f2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
      aria-label="Panier, 2 articles"
    >
      <svg lucideShoppingBasket size="29"></svg>
      <span
        class="absolute right-[-1px] top-[-2px] rounded-full bg-[#009f88] px-[4px] text-[8px] font-bold text-white"
        >2</span
      >
    </a>

    <a
      routerLink="/auth"
      class="flex shrink-0 items-center gap-2.5 rounded-xl py-1 text-[12px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009f88]"
    >
      @if (avatarUrl(); as avatarUrl) {
      <img
        [src]="avatarUrl"
        alt=""
        referrerpolicy="no-referrer"
        class="h-10 w-10 shrink-0 rounded-full object-cover ring-1 ring-black/5"
      />
      } @else {
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#e2e5e5] text-[#a5aaaa]"
      >
        <svg lucideUserRound size="28"></svg>
      </span>
      }
      <span class="whitespace-nowrap">
        <span class="text-[#087d6d] transition-colors hover:text-[#065f53]">
          {{ userDisplayName() }} </span
        ><br />
        <b class="font-bold text-[#171717]">Profil</b>
      </span>
    </a>
  </div>
</div>
