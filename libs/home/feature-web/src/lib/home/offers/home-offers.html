<section id="offers" class="border-y border-slate-200/80 bg-white">
  <div class="mx-auto max-w-7xl space-y-16 px-4 py-16 sm:px-6 lg:px-8">
    
    <section>
      <div class="flex items-end justify-between gap-4">
        <div>
          <h2 class="mt-2 text-3xl font-black tracking-tight text-slate-900">
            Nouveaux produits
          </h2>
        </div>
        <a
          routerLink="/products"
          class="shrink-0 text-sm font-bold text-[#008674]"
          >Voir tout →</a
        >
      </div>
      @if (status() === 'success') {
      <div class="mt-8 grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">
        @for (product of products(); track product.id) {<tpx-product-card
          [product]="product"
          (viewDetails)="openProduct($event)"
        />}
      </div>
      }
    </section>
  </div>
</section>
