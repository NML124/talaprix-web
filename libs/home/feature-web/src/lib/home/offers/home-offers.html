<section id="offres" class="border-y border-slate-200/80 bg-white">
  <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between">
      <div>
        <p class="text-sm font-bold uppercase tracking-[0.16em] text-[#009f88]">
          Pour vous
        </p>
        <h2 class="mt-2 text-3xl font-black tracking-tight text-slate-900">
          Les meilleures offres du moment
        </h2>
        <p class="mt-2 text-sm text-slate-500">
          Des prix comparés pour vous aider à acheter en toute confiance.
        </p>
      </div>
      <a
        href="#"
        class="hidden items-center gap-1 text-sm font-bold text-[#008674] sm:flex"
        >Voir tout <svg lucideArrowRight size="17"></svg
      ></a>
    </div>
    <div class="mt-8 grid grid-cols-2 gap-4 md:grid-cols-4">
      @for (product of products; track product) {
      <article
        class="group overflow-hidden rounded-2xl border border-slate-200 bg-[#fbfaf7]"
      >
        <div class="relative aspect-square bg-white p-8">
          <img
            src="/assets/images/panier.png"
            [alt]="product"
            class="h-full w-full object-contain"
          /><button
            class="absolute right-3 top-3 rounded-full bg-white p-2 text-slate-700"
            [attr.aria-label]="'Ajouter ' + product + ' aux favoris'"
          >
            <svg lucideHeart size="16"></svg>
          </button>
        </div>
        <div class="p-4">
          <div class="flex items-center gap-1 text-xs text-amber-500">
            <svg lucideStar size="13"></svg>4.8
            <span class="text-slate-400">· Boutique locale</span>
          </div>
          <h3 class="mt-2 min-h-10 text-sm font-bold text-slate-900">
            {{ product }}
          </h3>
          <p class="mt-3 text-lg font-black text-[#008674]">
            À partir de 159 000 FC
          </p>
          <button
            class="mt-3 w-full rounded-lg border border-[#bce9df] bg-[#e8f8f4] py-2 text-sm font-semibold text-[#007e6d]"
          >
            Comparer les prix
          </button>
        </div>
      </article>
      }
    </div>
  </div>
</section>
