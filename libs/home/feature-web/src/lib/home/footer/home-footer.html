<footer class="bg-white text-slate-700">
  <lib-footer-newsletter />

  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8 lg:py-16">
    <div
      class="grid grid-cols-2 gap-x-7 gap-y-11 sm:gap-x-10 md:grid-cols-3 lg:grid-cols-6 lg:gap-x-8"
    >
      <lib-footer-brand
        class="col-span-2 md:col-span-3 lg:col-span-2 lg:pr-8"
      />

      @for (section of linkSections; track section.title) {
      <lib-footer-links [title]="section.title" [links]="section.links" />
      }
    </div>

    <lib-footer-download />
  </div>

  <lib-footer-bottom />
</footer>
