<section
  class="relative overflow-hidden bg-cover bg-center bg-no-repeat"
  style="background-image: url('/assets/images/bg-banner.jpg')"
>
  <div class="absolute inset-0 bg-black/[0.62]"></div>

  <div
    class="relative mx-auto flex max-w-7xl flex-col items-center px-4 py-16 text-center sm:px-6 sm:py-20 lg:px-8 lg:py-24"
  >
    <h2
      class="max-w-2xl text-2xl font-semibold tracking-tight text-white sm:text-3xl lg:text-[34px]"
    >
      Les meilleurs prix, directement dans votre boîte mail.
    </h2>

    <p class="mt-4 max-w-xl text-sm leading-6 text-white/80 sm:text-[15px]">
      Recevez les nouvelles offres, les baisses de prix et les produits
      intéressants disponibles près de chez vous.
    </p>

    <form
      class="mt-8 flex w-full max-w-[600px] flex-col gap-3 sm:flex-row sm:items-center"
    >
      <label for="footer-email" class="sr-only">Votre adresse e-mail</label>

      <input
        id="footer-email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="Votre adresse e-mail"
        class="h-[46px] w-full min-w-0 appearance-none rounded-[100px] border border-white/20 bg-white px-5 text-[16px] text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-white focus:ring-4 focus:ring-white/15 sm:h-[48px] sm:flex-1"
      />

      <button
        type="submit"
        class="h-[46px] w-full shrink-0 rounded-[100px] bg-[#009788] px-7 text-sm font-medium text-white transition duration-200 hover:bg-[#008477] focus:outline-none focus:ring-4 focus:ring-[#009788]/30 sm:h-[48px] sm:w-auto"
      >
        S'inscrire
      </button>
    </form>

    <p
      class="mt-4 max-w-xl text-[12px] leading-[19px] text-white/70 sm:text-[13px] sm:leading-5"
    >
      En vous inscrivant, vous acceptez de recevoir les actualités Talaprix.
      Désinscription possible à tout moment.
    </p>
  </div>
</section>
