<section
  class="relative isolate mx-1 overflow-hidden rounded-[26px] bg-[#25302f] sm:mx-2 sm:rounded-[30px] lg:mx-1"
>
  <img
    src="/assets/images/bg-banner.jpg"
    alt="Un marché local où comparer les prix"
    class="absolute inset-0 -z-20 h-full w-full object-cover object-[center_30%]"
  />
  <div class="absolute inset-0 -z-10 bg-[#071313]/52"></div>

  <div
    class="mx-auto grid min-h-[380px] max-w-[1600px] items-center px-5 py-6 sm:min-h-[500px] sm:px-12 sm:py-9 lg:min-h-[520px] lg:grid-cols-[1.08fr_.92fr] lg:px-[clamp(48px,5vw,84px)] lg:py-11 xl:min-h-[550px]"
  >
    <div class="relative z-10 max-w-[760px] text-white">
      <h1
        class="max-w-[760px] text-[32px] font-black leading-[1.05] tracking-[-0.035em] sm:text-[64px] sm:leading-[0.99] sm:tracking-[-0.045em] lg:text-[70px] xl:text-[78px]"
      >
        Le Bon prix, au bon endroit.<span class="text-[#00a892]">
          Sans quitter votre domicile...</span
        >
      </h1>

      <p
        class="mt-4 max-w-[640px] text-[15px] leading-[1.4] text-white/90 sm:mt-10 sm:text-[21px] sm:leading-[1.42] sm:text-white lg:text-[22px]"
      >
        Comparez les prix à Kinshasa et achetez au meilleur tarif. De la Gombe à
        Ndjili, trouvez le prix le plus bas en un seul clic.
      </p>

      <div
        id="download"
        class="mt-6 flex w-full flex-row items-center gap-2.5 sm:mt-12 sm:gap-5"
      >
        <a
          href="#"
          class="flex h-[48px] flex-1 items-center justify-center gap-2 rounded-[10px] border border-white/15 bg-black px-2 text-white transition-transform hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white sm:h-[64px] sm:w-[198px] sm:flex-none sm:gap-3 sm:px-4"
          aria-label="Télécharger TalaPrix sur Google Play"
        >
          <img
            src="/assets/images/playstore.png"
            alt=""
            class="h-6 w-6 object-contain sm:h-10 sm:w-10"
          />
          <span class="leading-none">
            <small class="block text-[8px] font-normal sm:text-[10px]"
              >Disponible sur</small
            >
            <b
              class="mt-0.5 block whitespace-nowrap text-[13px] font-bold sm:mt-1 sm:text-[21px]"
              >Google Play</b
            >
          </span>
        </a>

        <a
          href="#"
          class="flex h-[48px] flex-1 items-center justify-center gap-2 rounded-[10px] border border-white/15 bg-black px-2 text-white transition-transform hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white sm:h-[64px] sm:w-[198px] sm:flex-none sm:gap-3 sm:px-4"
          aria-label="Télécharger TalaPrix sur l’App Store"
        >
          <img
            src="/assets/images/logo-apple.png"
            alt=""
            class="h-6 w-6 object-contain sm:h-10 sm:w-10"
          />
          <span class="leading-none">
            <small class="block text-[8px] font-normal sm:text-[10px]"
              >Disponible sur</small
            >
            <b
              class="mt-0.5 block whitespace-nowrap text-[13px] font-bold sm:mt-1 sm:text-[21px]"
              >App Store</b
            >
          </span>
        </a>
      </div>
    </div>

    <div class="hidden h-full items-end justify-end lg:flex">
      <img
        src="/assets/images/panier.png"
        alt="Panier TalaPrix rempli de cadeaux et d'offres"
        class="h-[480px] w-auto max-w-none translate-x-[4%] translate-y-[4%] object-contain xl:h-[530px]"
      />
    </div>
  </div>
</section>
