<section
  class="border-y border-slate-200/80 bg-white [font-family:'Lato',sans-serif]"
>
  <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
    <div
      class="relative overflow-hidden rounded-[28px] border border-[#e4eee9] bg-gradient-to-br from-[#fbfffc] via-[#f3fff8] to-[#edfbf3]"
    >
      <div
        class="pointer-events-none absolute -bottom-40 -left-32 h-[420px] w-[420px] rounded-full bg-[#dff7e9]/60 blur-3xl"
      ></div>
      <div
        class="pointer-events-none absolute -right-28 -top-32 h-[360px] w-[360px] rounded-full bg-white/80 blur-3xl"
      ></div>
      <div
        class="relative grid min-h-[560px] gap-10 px-5 py-8 sm:px-8 sm:py-10 lg:grid-cols-[0.92fr_1.35fr] lg:items-center lg:gap-12 lg:px-12 lg:py-12 xl:min-h-[590px]"
      >
        <div class="relative z-10 max-w-[560px]">
          <h2
            class="max-w-[560px] text-[36px] font-black leading-[1.05] tracking-[-0.035em] text-[#101514] sm:text-[44px] lg:text-[48px] xl:text-[52px]"
          >
            Trouvez les meilleurs produits
            <span class="text-[#087967]">autour de vous</span>
          </h2>
          <p
            class="mt-6 max-w-[540px] text-[14px] leading-7 text-[#626e6a] sm:text-[15px]"
          >
            Découvrez les offres disponibles près de chez vous, comparez les
            prix locaux et achetez plus intelligemment auprès des boutiques de
            votre quartier.
          </p>
          <div class="mt-8 flex flex-wrap items-center gap-x-9 gap-y-5">
            <div class="flex items-center gap-3">
              <span
                class="grid h-[40px] w-[40px] shrink-0 place-items-center rounded-full bg-[#e5f6ed] text-[#22965b]"
                ><svg
                  lucideMapPin
                  size="20"
                  strokeWidth="2"
                  aria-hidden="true"
                ></svg
              ></span>
              <p
                class="text-[11px] font-bold uppercase leading-[16px] tracking-[0.01em] text-[#1f2926] sm:text-[12px]"
              >
                Boutiques <span class="block">proches</span>
              </p>
            </div>
            <div class="flex items-center gap-3">
              <span
                class="grid h-[40px] w-[40px] shrink-0 place-items-center rounded-full bg-[#e5f6ed] text-[#22965b]"
                ><svg
                  lucideTag
                  size="20"
                  strokeWidth="2"
                  aria-hidden="true"
                ></svg
              ></span>
              <p
                class="text-[11px] font-bold uppercase leading-[16px] tracking-[0.01em] text-[#1f2926] sm:text-[12px]"
              >
                Prix <span class="block">comparés</span>
              </p>
            </div>
          </div>
          <div class="mt-9 flex flex-wrap items-center gap-3">
            <a
              routerLink="/products"
              [queryParams]="{ nearby: true }"
              class="group inline-flex h-[44px] items-center justify-center gap-2.5 rounded-full bg-[#25964d] px-6 text-[13px] font-bold text-white transition duration-300 hover:bg-[#1f8544] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#25964d]/30"
              >Voir les offres
              <svg
                lucideArrowRight
                size="16"
                class="transition-transform duration-200 group-hover:translate-x-1"
                aria-hidden="true"
              ></svg></a
            ><a
              routerLink="/products"
              class="inline-flex h-[44px] items-center justify-center rounded-full border border-[#27332f] bg-white/50 px-7 text-[13px] font-bold text-[#202825] transition hover:bg-white"
              >Explorer</a
            >
          </div>
        </div>
        <lib-nearby-showcase
          [products]="displayedProducts()"
          [autoplayDelay]="autoplayDelay()"
        />
      </div>
    </div>
  </div>
</section>
