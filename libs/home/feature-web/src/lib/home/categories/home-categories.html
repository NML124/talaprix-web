<section id="categories" class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="flex items-end justify-between">
    <div>
      <p class="text-sm font-bold uppercase tracking-[0.16em] text-[#009f88]">
        Explorez
      </p>
      <h2 class="mt-2 text-3xl font-black tracking-tight text-slate-900">
        Qu'est-ce que vous cherchez ?
      </h2>
    </div>
    <a
      href="#offres"
      class="hidden items-center gap-1 text-sm font-bold text-[#008674] sm:flex"
      >Toutes les catégories <svg lucideChevronRight size="17"></svg
    ></a>
  </div>
  <div class="mt-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
    @for (category of categories; track category) {<a
      href="#offres"
      class="group relative min-h-48 overflow-hidden rounded-2xl bg-slate-900"
      ><img
        src="/assets/images/logo_app.png"
        [alt]="category"
        class="absolute inset-0 h-full w-full object-contain bg-white/95 p-8 transition duration-500 group-hover:scale-105"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent"
      ></div>
      <div class="absolute bottom-0 p-4 text-white">
        <h3 class="font-bold">{{ category }}</h3>
        <p class="mt-1 text-xs text-slate-200">Trouvez les meilleurs prix</p>
      </div></a
    >}
  </div>
</section>
